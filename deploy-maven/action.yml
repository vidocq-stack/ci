name: 'Deploy to Maven Central'
description: 'Write settings.xml + import GPG key + deploy: SNAPSHOT via maven-deploy-plugin (maven.vidocq.dev when snapshot credentials are given, else central-snapshots), RELEASE via central-publishing. Maven must already be on the PATH.'

inputs:
  central-username:
    description: 'Sonatype Central Portal username'
    required: true
  central-password:
    description: 'Sonatype Central Portal password / token'
    required: true
  gpg-private-key:
    description: 'GPG private key (armored, ideally base64-encoded)'
    required: true
  gpg-passphrase:
    description: 'GPG key passphrase'
    required: true
  snapshot-repository-url:
    description: 'Maven repository the SNAPSHOTs go to when snapshot-username and snapshot-password are set'
    default: 'https://maven.vidocq.dev/snapshots'
  snapshot-username:
    description: 'User of snapshot-repository-url (a Reposilite token name); empty = SNAPSHOTs go to central-snapshots'
    default: ''
  snapshot-password:
    description: 'Secret of snapshot-username'
    default: ''
  snapshot-profile:
    description: 'Maven profile for SNAPSHOT deployments'
    default: 'snapshot'
  release-profile:
    description: 'Maven profile for RELEASE deployments'
    default: 'release'
  maven-args:
    description: 'Common Maven args'
    default: '-B -ntp'
  skip-tests:
    description: >
      'true' (default): deploy with -DskipTests, after a separate build-and-test step. 'false': the
      deploy runs the tests itself, in one pass, so the caller drops its build step. Only safe when
      the reactor sets maven-deploy-plugin's deployAtEnd to true (every pom, BOM and parents
      included): otherwise the modules built before a failing test are already published.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure Maven credentials (Sonatype Central Portal, maven.vidocq.dev)
      shell: bash
      env:
        CENTRAL_USERNAME: ${{ inputs.central-username }}
        CENTRAL_PASSWORD: ${{ inputs.central-password }}
        SNAPSHOT_USERNAME: ${{ inputs.snapshot-username }}
        SNAPSHOT_PASSWORD: ${{ inputs.snapshot-password }}
      run: |
        set -euo pipefail
        mkdir -p ~/.m2
        # With maven.vidocq.dev credentials, central-snapshots is only read, anonymously: a Central token on
        # that server authenticates every SNAPSHOT read, and a refused token then fails them all with 403
        # (2026-10-30). Without them, the SNAPSHOTs still go to central-snapshots, which needs the token.
        if [ -n "$SNAPSHOT_PASSWORD" ]; then
          SNAPSHOT_SERVERS="<server><id>vidocq-snapshots</id><username>${SNAPSHOT_USERNAME}</username><password>${SNAPSHOT_PASSWORD}</password></server>"
        else
          SNAPSHOT_SERVERS="<server><id>central-snapshots</id><username>${CENTRAL_USERNAME}</username><password>${CENTRAL_PASSWORD}</password></server>"
        fi
        cat > ~/.m2/settings.xml <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings>
          <servers>
            <server>
              <id>central</id>
              <username>${CENTRAL_USERNAME}</username>
              <password>${CENTRAL_PASSWORD}</password>
            </server>
            ${SNAPSHOT_SERVERS}
          </servers>
          <profiles>
            <profile>
              <id>vidocq-snapshots</id>
              <repositories>
                <repository>
                  <id>vidocq-snapshots</id>
                  <url>https://maven.vidocq.dev/snapshots</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>vidocq-snapshots</id>
                  <url>https://maven.vidocq.dev/snapshots</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>vidocq-snapshots</activeProfile>
          </activeProfiles>
        </settings>
        EOF

    - name: Import GPG signing key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail
        if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
          echo "❌ gpg-private-key is empty or missing" >&2; exit 1
        fi
        # The key may be stored base64-encoded (recommended, avoids mangled newlines)
        # or as raw ASCII-armored text. Try base64 decode first, otherwise import as-is.
        if echo "$GPG_PRIVATE_KEY" | base64 -d 2>/dev/null | gpg --batch --import 2>/dev/null; then
          echo "✅ GPG key imported (base64)"
        else
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        fi
        if ! gpg --list-secret-keys --with-colons | grep -q '^sec'; then
          echo "❌ No GPG private key imported — gpg-private-key must contain the armored key (ideally base64 of 'gpg --export-secret-keys --armor')" >&2
          exit 1
        fi
        # Loopback mode so maven-gpg-plugin can inject the passphrase.
        echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf 2>/dev/null || \
          (mkdir -p ~/.gnupg && chmod 700 ~/.gnupg && echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf)
        gpgconf --kill gpg-agent || true

    - name: Deploy
      shell: bash
      env:
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        MVN_ARGS: ${{ inputs.maven-args }}
        SNAPSHOT_PROFILE: ${{ inputs.snapshot-profile }}
        RELEASE_PROFILE: ${{ inputs.release-profile }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        SNAPSHOT_URL: ${{ inputs.snapshot-repository-url }}
        SNAPSHOT_PASSWORD: ${{ inputs.snapshot-password }}
      run: |
        set -euo pipefail
        SKIP_ARG=-DskipTests
        if [ "$SKIP_TESTS" = "false" ]; then SKIP_ARG=""; fi
        VERSION=$(mvn -q -DforceStdout -N help:evaluate -Dexpression=project.version)
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          if [ -n "$SNAPSHOT_PASSWORD" ]; then
            echo "Version $VERSION → publishing SNAPSHOT to $SNAPSHOT_URL (maven-deploy-plugin)"
            mvn $MVN_ARGS -P"$SNAPSHOT_PROFILE" deploy $SKIP_ARG \
              -DaltSnapshotDeploymentRepository="vidocq-snapshots::$SNAPSHOT_URL"
          else
            echo "Version $VERSION → publishing SNAPSHOT to central-snapshots (maven-deploy-plugin)"
            mvn $MVN_ARGS -P"$SNAPSHOT_PROFILE" deploy $SKIP_ARG
          fi
        else
          echo "Version $VERSION → publishing RELEASE via central-publishing-maven-plugin"
          mvn $MVN_ARGS -P"$RELEASE_PROFILE" deploy $SKIP_ARG -Dgpg.passphrase="$GPG_PASSPHRASE"
        fi
