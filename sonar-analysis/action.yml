name: 'SonarQube analysis'
description: >-
  Analyse the Maven build with SonarQube (community branch plugin): the main branch on push,
  pull requests with their own quality gate. Report mode by default: the job never fails on a
  finding, and a pull request gets one comment, kept up to date, with the quality gate. The
  findings of the security scans, of Error Prone when the build runs it and of Infer's RacerD when
  asked, are imported as external issues; the API compatibility japicmp measures, when the build runs it, gets a
  pull-request comment of its own.

inputs:
  sonar-token:
    description: 'SonarQube token (secrets.SONAR_TOKEN). Empty on pull requests from forks, which receive no secrets: the analysis is then skipped.'
    required: true
  host-url:
    description: 'SonarQube URL (vars.SONAR_HOST_URL)'
    required: true
  project-key:
    description: "SonarQube project key; default vidocq-<repository name>. Created on the server when it does not exist (the token's user needs the Create Projects permission): SonarQube refuses to analyse a pull request of an unknown project."
    default: ''
  bot-token:
    description: '(pull requests, optional) Codefloe token that posts the quality-gate comment (secrets.VIDOCQ_BOT_TOKEN); no comment when empty'
    default: ''
  maven-args:
    description: "Maven arguments of the build, run before the security scans and the analysis. The build must write the JaCoCo XML reports for coverage (the quality profile of vidocq-parent does) and install the modules into the job's local repository, so that the separate analysis run resolves them. Test failures do not stop the analysis: the pull request validation is the test gate, and JaCoCo instrumentation slows timing-sensitive tests down. Add the repository's errorprone profile (-Pquality,errorprone) and Error Prone's warnings become external issues."
    default: '-B -ntp -Pquality -Dmaven.test.failure.ignore=true install'
  analysis-args:
    description: 'Maven arguments of the analysis run, which works on what the build left in target/: the same profiles, no lifecycle phase'
    default: '-B -ntp -Pquality'
  cyclonedx-version:
    description: 'cyclonedx-maven-plugin version: the build writes the CycloneDX SBOM (target/bom.json) that the dependency scan reads'
    default: '2.9.3'
  scanner-version:
    description: 'sonar-maven-plugin version'
    default: '5.8.0.7211'
  blocking:
    description: "'true' fails the job when the analysis fails or the quality gate is not passed (the blocking waves of the rollout plan, Vidocq/vidocq#284); 'false' only reports"
    default: 'false'
  security-scans:
    description: "'true' also runs OSV-Scanner (dependency vulnerabilities), OpenGrep (security patterns) and Trivy (secrets, Dockerfile misconfigurations) and imports their SARIF reports into SonarQube as external issues (Vidocq/vidocq#269); they never stop the analysis"
    default: 'true'
  infer:
    description: "'true' also runs Infer's RacerD (data races) over the main sources of the build's modules and imports its findings as reliability issues (Vidocq/vidocq#269); opt-in: it downloads Infer (276 MB) on every run. Never stops the analysis"
    default: 'false'

runs:
  using: composite
  steps:
    # Vidocq/ci#57: a pull request whose code tree was already analysed (a docs-only commit, a rebase on a
    # docs-only move of main, the merge-bot's re-signing of an unchanged rebase) gets the quality gate of that
    # analysis read again, instead of a new build and analysis, when that analysis is still the pull request's last
    # one: the record of a code tree is keyed with the date of the analysis it records, and looked up with the date of
    # the pull request's last analysis.
    - name: Date of the pull request's last analysis
      id: last
      if: github.event_name == 'pull_request' && inputs.sonar-token != ''
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
        PROJECT_KEY: ${{ inputs.project-key }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, sys, urllib.parse, urllib.request
        host = os.environ["SONAR_HOST_URL"].rstrip("/")
        key = (os.environ.get("PROJECT_KEY") or "vidocq-" + os.environ["REPOSITORY"].split("/")[-1]).lower()
        try:
            # project_analyses/search ignores pullRequest (main's analyses), and ce/activity needs the administer
            # permission: the pull request list gives the date of its last analysis.
            req = urllib.request.Request("%s/api/project_pull_requests/list?project=%s" % (host, urllib.parse.quote(key)),
                                         headers={"Authorization": "Bearer " + os.environ["SONAR_TOKEN"]})
            with urllib.request.urlopen(req, timeout=30) as r:
                prs = json.load(r).get("pullRequests") or []
            date = next((p.get("analysisDate", "") for p in prs if p.get("key") == os.environ["PR_NUMBER"]), "")
        except Exception as e:  # no date: nothing can match, the pull request is analysed
            print("::warning::Cannot read the pull request's last analysis (%s)." % e, file=sys.stderr)
            date = ""
        print("date=%s" % (date or "none"))
        PY

    - name: Was this code tree that analysis?
      id: tree
      if: github.event_name == 'pull_request' && inputs.sonar-token != ''
      uses: https://codefloe.com/Vidocq/ci/validated-tree@main
      with:
        mode: check
        scope: sonar-pr${{ github.event.pull_request.number }}
        key-suffix: ${{ steps.last.outputs.date }}
        bot-token: ${{ inputs.bot-token }}

    - name: SonarQube analysis
      if: steps.tree.outputs.reused != 'true'
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
        PROJECT_KEY: ${{ inputs.project-key }}
        MAVEN_ARGS_IN: ${{ inputs.maven-args }}
        ANALYSIS_ARGS: ${{ inputs.analysis-args }}
        CYCLONEDX_VERSION: ${{ inputs.cyclonedx-version }}
        SECURITY_SCANS: ${{ inputs.security-scans }}
        INFER: ${{ inputs.infer }}
        ACTION_PATH: ${{ github.action_path }}
        SCANNER_VERSION: ${{ inputs.scanner-version }}
        BLOCKING: ${{ inputs.blocking }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        REPOSITORY: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail
        if [ -z "${SONAR_TOKEN}" ]; then
          echo "::notice::No SonarQube token (pull request from a fork?): analysis skipped."
          echo "SONAR_ANALYSED=false" >> "$GITHUB_ENV"
          exit 0
        fi
        repo="${REPOSITORY##*/}"
        key="${PROJECT_KEY:-vidocq-${repo}}"
        key="${key,,}"
        api="${SONAR_HOST_URL%/}/api"
        auth=(-H "Authorization: Bearer ${SONAR_TOKEN}")
        # A server that does not answer is said on the pull request (quality-gate step), not hidden behind a green job.
        # Only no answer at all (000) or a server error counts: the server answers an unauthenticated or redirected
        # request with a 3xx/4xx, and is up.
        status=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "${auth[@]}" "${api}/system/status" 2>/dev/null || true)
        if [ -z "${status}" ] || [ "${status}" = "000" ] || [ "${status:0:1}" = "5" ]; then
          echo "::warning::SonarQube (${SONAR_HOST_URL}) does not answer (HTTP ${status:-none}): no analysis."
          echo "SONAR_ANALYSED=false" >> "$GITHUB_ENV"
          echo "SONAR_UNREACHABLE=true" >> "$GITHUB_ENV"
          exit 0
        fi
        # SonarQube refuses to analyse a pull request of a project that does not exist yet.
        if [ "$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${api}/components/show?component=${key}")" = "404" ]; then
          created=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" \
            --data-urlencode "project=${key}" --data-urlencode "name=${repo}" \
            --data-urlencode "mainBranch=${DEFAULT_BRANCH:-main}" "${api}/projects/create")
          if [ "${created}" = "200" ]; then echo "Created the SonarQube project ${key}."
          else echo "::warning::Could not create the SonarQube project ${key} (HTTP ${created})."; fi
        fi
        args=("-Dsonar.host.url=${SONAR_HOST_URL}" "-Dsonar.projectKey=${key}")
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          args+=("-Dsonar.pullrequest.key=${PR_NUMBER}"
                 "-Dsonar.pullrequest.branch=${HEAD_REF}"
                 "-Dsonar.pullrequest.base=${BASE_REF}")
        fi
        # 1. Build, tests and coverage, plus the CycloneDX SBOM of what the build ships, which the
        #    dependency scan reads: compile and runtime scopes only. Test, provided (the Maven API
        #    of a plugin, a container's specifications) and system dependencies are not shipped.
        #    The *_ARGS variables are split on purpose: several arguments. The log is kept for the
        #    Error Prone findings (step 3).
        build_log="${RUNNER_TEMP:-/tmp}/vidocq-build.log"
        # shellcheck disable=SC2086
        if ! mvn ${MAVEN_ARGS_IN} "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_VERSION}:makeAggregateBom" \
            -DoutputFormat=json -DoutputName=bom \
            -DincludeTestScope=false -DincludeProvidedScope=false -DincludeSystemScope=false 2>&1 \
            | tee "${build_log}"; then
          echo "SONAR_ANALYSED=false" >> "$GITHUB_ENV"
          if [ "${BLOCKING}" = "true" ]; then exit 1; fi
          echo "::warning::The build failed, no SonarQube analysis (report mode: not blocking)."
          exit 0
        fi
        reports=()
        # 2. Security scans: their reports become external issues; they never stop the analysis.
        if [ "${SECURITY_SCANS}" = "true" ]; then
          bash "${ACTION_PATH}/security-scans.sh" || echo "::warning::The security scans failed."
          sarif=$(cat "${RUNNER_TEMP:-/tmp}/vidocq-security/sarif-paths" 2>/dev/null || true)
          if [ -n "${sarif}" ]; then reports+=("${sarif}"); fi
        fi
        # 3. Error Prone, when the build ran it (a repository's errorprone profile in maven-args, in
        #    report mode): its warnings become external issues too, minus the modules SonarQube
        #    does not analyse. Through the generic format, as reliability issues: a SARIF import
        #    would count each of them as a vulnerability.
        generic=()
        ep="${RUNNER_TEMP:-/tmp}/vidocq-errorprone"
        mkdir -p "${ep}"
        if ! found=$(python3 "${ACTION_PATH}/errorprone-sarif.py" "${build_log}" "${ep}/raw.sarif"); then
          echo "::warning::Cannot read the Error Prone findings of the build log."
        elif [ "${found}" -gt 0 ]; then
          if python3 "${ACTION_PATH}/normalize-sarif.py" "${GITHUB_WORKSPACE:-$PWD}" "${ep}/raw.sarif" "${ep}/error-prone.sarif" error-prone > /dev/null \
              && kept=$(python3 "${ACTION_PATH}/sarif-to-generic.py" "${ep}/error-prone.sarif" "${ep}/error-prone.json" "${GITHUB_WORKSPACE:-$PWD}" error-prone RELIABILITY MEDIUM LOGICAL); then
            echo "Error Prone: ${kept} finding(s)"
            if [ "${kept}" -gt 0 ]; then generic+=("${ep}/error-prone.json"); fi
          else
            echo "::warning::Cannot convert the Error Prone report."
          fi
        fi
        # 4. Infer's RacerD, when the repository asks for it: data races, as reliability issues of high
        #    severity, through the generic format too.
        if [ "${INFER}" = "true" ]; then
          if infer_report=$(bash "${ACTION_PATH}/infer.sh"); then
            if [ -n "${infer_report}" ]; then generic+=("${infer_report}"); fi
          else
            echo "::warning::Infer failed."
          fi
        fi
        if [ "${#reports[@]}" -gt 0 ]; then
          args+=("-Dsonar.sarifReportPaths=$(IFS=,; echo "${reports[*]}")")
        fi
        if [ "${#generic[@]}" -gt 0 ]; then
          args+=("-Dsonar.externalIssuesReportPaths=$(IFS=,; echo "${generic[*]}")")
        fi
        # 5. The analysis of what the build left in target/.
        # shellcheck disable=SC2086
        if mvn ${ANALYSIS_ARGS} "org.sonarsource.scanner.maven:sonar-maven-plugin:${SCANNER_VERSION}:sonar" "${args[@]}"; then
          echo "SONAR_ANALYSED=true" >> "$GITHUB_ENV"
        else
          echo "SONAR_ANALYSED=false" >> "$GITHUB_ENV"
          if [ "${BLOCKING}" = "true" ]; then exit 1; fi
          echo "::warning::SonarQube analysis failed (report mode: not blocking)."
        fi

    - name: SonarQube quality gate
      id: gate
      if: env.SONAR_ANALYSED == 'true' || env.SONAR_UNREACHABLE == 'true' || steps.tree.outputs.reused == 'true'
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
        PROJECT_KEY: ${{ inputs.project-key }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        BLOCKING: ${{ inputs.blocking }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPOSITORY: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        REUSED: ${{ steps.tree.outputs.reused }}
        REUSED_FROM: ${{ steps.tree.outputs.recorded-commit }}
      run: |
        python3 - <<'PY'
        import json, os, sys, time, urllib.error, urllib.parse, urllib.request

        host = os.environ["SONAR_HOST_URL"].rstrip("/")
        token = os.environ["SONAR_TOKEN"]
        blocking = os.environ.get("BLOCKING") == "true"
        is_pr = os.environ.get("EVENT_NAME") == "pull_request"
        pr = os.environ.get("PR_NUMBER", "")
        reused = os.environ.get("REUSED") == "true"
        unreachable = os.environ.get("SONAR_UNREACHABLE") == "true"
        head = os.environ.get("HEAD_SHA", "")[:8]
        q = urllib.parse.quote

        def sonar(path):
            req = urllib.request.Request(host + path, headers={"Authorization": "Bearer " + token})
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.load(r)

        def forge(method, path, body=None):
            req = urllib.request.Request(
                os.environ["SERVER_URL"].rstrip("/") + "/api/v1" + path,
                data=None if body is None else json.dumps(body).encode(),
                method=method,
                headers={"Authorization": "token " + os.environ["BOT_TOKEN"], "Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=30) as r:
                raw = r.read()
                return json.loads(raw) if raw else None

        marker = "<!-- vidocq-sonarqube -->"

        def comment(lines):
            """The pull request's one SonarQube comment, created or kept up to date."""
            if not (is_pr and os.environ.get("BOT_TOKEN") and pr):
                return
            body = "\n".join([marker] + lines)
            repo = os.environ["REPOSITORY"]
            try:
                comments = forge("GET", "/repos/%s/issues/%s/comments" % (repo, pr)) or []
                mine = next((c for c in comments if marker in (c.get("body") or "")), None)
                if mine:
                    forge("PATCH", "/repos/%s/issues/comments/%s" % (repo, mine["id"]), {"body": body})
                else:
                    forge("POST", "/repos/%s/issues/%s/comments" % (repo, pr), {"body": body})
            except urllib.error.URLError as e:
                print("::warning::Could not post the SonarQube comment: %s" % e)

        if unreachable:
            # Said on the pull request: a silent green job read as "nothing to report" (Vidocq/ci#57).
            comment(["### SonarQube quality gate: ➖ not analysed", "",
                     "SonarQube (%s) did not answer, so commit `%s` has no analysis. Re-run the sonar job, or push "
                     "again, once it is back." % (host, head)])
            sys.exit(1 if blocking else 0)

        if reused:
            # The same code tree, by the analysis that is still the pull request's last one: its quality gate, read
            # again, follows what was resolved on the server since (false positives, accepted issues).
            key = (os.environ.get("PROJECT_KEY") or "vidocq-" + os.environ["REPOSITORY"].split("/")[-1]).lower()
            gate = sonar("/api/qualitygates/project_status?projectKey=%s&pullRequest=%s" % (q(key), q(pr)))["projectStatus"]
            dashboard = "%s/dashboard?id=%s&pullRequest=%s" % (host, q(key), q(pr))
        else:
            # The scanner writes the task of the server-side processing next to the root module.
            task = dict(line.rstrip("\n").split("=", 1) for line in open("target/sonar/report-task.txt") if "=" in line)
            ce, deadline = None, time.time() + 600
            while time.time() < deadline:
                ce = sonar("/api/ce/task?id=" + q(task["ceTaskId"]))["task"]
                if ce["status"] in ("SUCCESS", "FAILED", "CANCELED"):
                    break
                time.sleep(5)
            if not ce or ce["status"] != "SUCCESS":
                print("::warning::SonarQube did not process the analysis (%s)." % (ce or {}).get("status", "timeout"))
                sys.exit(1 if blocking else 0)
            gate = sonar("/api/qualitygates/project_status?analysisId=" + q(ce["analysisId"]))["projectStatus"]
            key, dashboard = task.get("projectKey", ""), task.get("dashboardUrl", host)
            if is_pr:
                # Recorded with the code tree: a later run reuses this analysis only while it is the pull request's last.
                prs = sonar("/api/project_pull_requests/list?project=" + q(key)).get("pullRequests") or []
                date = next((p.get("analysisDate", "") for p in prs if p.get("key") == pr), "")
                with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                    out.write("analysis=%s\n" % date)

        status = gate.get("status", "NONE")
        failed = [c for c in gate.get("conditions", []) if c.get("status") == "ERROR"]
        scope = "&pullRequest=" + q(pr) if is_pr else ""
        issues = sonar("/api/issues/search?components=%s%s&resolved=false&ps=1" % (q(key), scope))["total"]
        hotspots = sonar("/api/hotspots/search?projectKey=%s%s&status=TO_REVIEW&ps=1" % (q(key), scope))["paging"]["total"]
        print("Quality gate: %s | %s issues | %s hotspots to review | %s" % (status, issues, hotspots, dashboard))

        verdict = {"OK": "✅ passed", "ERROR": "❌ failed", "WARN": "⚠️ warning"}.get(status, "➖ " + status.lower())
        lines = ["### SonarQube quality gate: " + verdict, "",
                 "New issues: **%s** · security hotspots to review: **%s**" % (issues, hotspots)]
        if failed:
            lines += ["", "Failed conditions:"] + [
                "- `%s`: %s (must be %s %s)" % (c.get("metricKey"), c.get("actualValue", "?"),
                                                "≥" if c.get("comparator") == "LT" else "≤", c.get("errorThreshold", "?"))
                for c in failed]
        footer = "[Open the analysis](%s) · %s · commit `%s`" % (
            dashboard, "blocking" if blocking else "report mode, not blocking", head)
        if reused:
            footer += " · same code as `%s`, whose analysis is reused" % os.environ.get("REUSED_FROM", "")[:8]
        comment(lines + ["", footer])

        if blocking and status != "OK":
            sys.exit(1)
        PY

    - name: Record the analysed code tree
      # The next push of the same code (Vidocq/ci#57) reads this analysis's gate instead of analysing again.
      if: steps.gate.outputs.analysis != '' && github.event_name == 'pull_request'
      uses: https://codefloe.com/Vidocq/ci/validated-tree@main
      with:
        mode: record
        scope: sonar-pr${{ github.event.pull_request.number }}
        tree-id: ${{ steps.tree.outputs.tree-id }}
        key-suffix: ${{ steps.gate.outputs.analysis }}
        bot-token: ${{ inputs.bot-token }}

    - name: API compatibility report
      # A module whose build runs japicmp (Vidocq/vidocq#288) leaves target/japicmp/: its summary goes to
      # the log, and to one comment on the pull request. Nothing to do otherwise. Never fails the job.
      if: always()
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPOSITORY: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "${ACTION_PATH}/api-compat-comment.py" "${GITHUB_WORKSPACE:-$PWD}" || echo "::warning::The API compatibility report failed."
