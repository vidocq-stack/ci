name: 'Run TCK'
description: 'Lance un TCK Maven paramétré (module/profil) ou un script shell custom. Maven doit déjà être dans le PATH (cf. setup-maven).'

inputs:
  command:
    description: 'Commande shell custom à exécuter pour le TCK (prioritaire si non vide, ex. "./run-official-tck-restful-4.0.sh all")'
    default: ''
  module:
    description: 'Module Maven ciblé via -pl (vide = reactor complet)'
    default: ''
  profile:
    description: 'Profil Maven activé pour le TCK'
    default: 'tck'
  pre-install:
    description: 'Lancer "mvn install -DskipTests" avant le TCK'
    default: 'true'
  maven-args:
    description: 'Arguments Maven communs'
    default: '-B -ntp'

runs:
  using: composite
  steps:
    - name: TCK
      shell: bash
      env:
        TCK_COMMAND: ${{ inputs.command }}
        TCK_MODULE: ${{ inputs.module }}
        TCK_PROFILE: ${{ inputs.profile }}
        TCK_PRE_INSTALL: ${{ inputs.pre-install }}
        MVN_ARGS: ${{ inputs.maven-args }}
      run: |
        set -euo pipefail
        if [ "$TCK_PRE_INSTALL" = "true" ]; then
          echo "Pré-install : mvn $MVN_ARGS install -DskipTests"
          mvn $MVN_ARGS install -DskipTests
        fi
        if [ -n "$TCK_COMMAND" ]; then
          echo "TCK via commande custom : $TCK_COMMAND"
          bash -c "$TCK_COMMAND"
        else
          PL=""
          [ -n "$TCK_MODULE" ] && PL="-pl $TCK_MODULE"
          echo "TCK via Maven : mvn $MVN_ARGS $PL -P$TCK_PROFILE test"
          mvn $MVN_ARGS $PL -P"$TCK_PROFILE" test
        fi
