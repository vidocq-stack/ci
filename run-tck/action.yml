name: 'Run TCK'
description: 'Run a parameterized Maven TCK (module/profile) or a custom shell script. Maven must already be on the PATH (see setup-maven).'

inputs:
  command:
    description: 'Custom shell command to run the TCK (takes precedence when non-empty, e.g. "./run-official-tck-restful-4.0.sh all")'
    default: ''
  module:
    description: 'Maven module targeted via -pl (empty = whole reactor)'
    default: ''
  profile:
    description: 'Maven profile enabled for the TCK'
    default: 'tck'
  pre-install:
    description: 'Run "mvn install -DskipTests" before the TCK'
    default: 'true'
  maven-args:
    description: 'Common Maven args'
    default: '-B -ntp'

runs:
  using: composite
  steps:
    - name: TCK
      shell: bash
      env:
        TCK_COMMAND: ${{ inputs.command }}
        TCK_MODULE: ${{ inputs.module }}
        TCK_PROFILE: ${{ inputs.profile }}
        TCK_PRE_INSTALL: ${{ inputs.pre-install }}
        MVN_ARGS: ${{ inputs.maven-args }}
      run: |
        set -euo pipefail
        if [ "$TCK_PRE_INSTALL" = "true" ]; then
          echo "Pre-install: mvn $MVN_ARGS install -DskipTests"
          mvn $MVN_ARGS install -DskipTests
        fi
        if [ -n "$TCK_COMMAND" ]; then
          echo "TCK via custom command: $TCK_COMMAND"
          bash -c "$TCK_COMMAND"
        else
          PL=""
          [ -n "$TCK_MODULE" ] && PL="-pl $TCK_MODULE"
          echo "TCK via Maven: mvn $MVN_ARGS $PL -P$TCK_PROFILE test"
          mvn $MVN_ARGS $PL -P"$TCK_PROFILE" test
        fi
