name: 'Reuse the validation of an unchanged code tree'
description: >
  Vidocq/ci#57. A pull request rebuilt everything on every push, even when its code had not changed
  since its last green run: a docs-only commit, a rebase on a main that moved by documentation only,
  the merge-bot's re-signing of an unchanged rebase. This action keys a validation on the code-tree
  id of HEAD (its tree without the documentation files, validated_tree.py) instead of the commit.
  mode 'check' says whether a run with the same scope already validated that id; mode 'record',
  at the end of a green run, records it, as a ref of the repository (refs/validated/<scope>/<id>),
  which every runner sees: the actions cache is per runner. Needs git and python3, and the repository
  checked out to compute the id (mode 'check', or 'record' without tree-id).

inputs:
  mode:
    description: "'check' (before the work) or 'record' (after it succeeded)"
    required: true
  scope:
    description: >
      What was validated, part of the key: 'pr-validate' for the producer's build and the downstream
      check, 'sonar-pr<number>' for a pull request's SonarQube analysis. A record of one scope never
      satisfies another.
    required: true
  tree-id:
    description: "mode 'record': the id the check output (a job output of the checking job). Empty: computed from HEAD."
    default: ''
  key-suffix:
    description: >
      Appended to the key, in both modes: what else the validation is of, known before the check. The SonarQube
      analysis passes the date of the pull request's last analysis, so a record matches only while the analysis it
      records is still the pull request's last one.
    default: ''
  note:
    description: "mode 'record': one more line kept with the record, read back by a later check as recorded-note "
    default: ''
  bot-token:
    description: "Codefloe token (org secret VIDOCQ_BOT_TOKEN): mode 'record' pushes the record ref with it (nothing is recorded without it); mode 'check' looks for companion branches with it, without rate limits, and may run without it"
    default: ''

outputs:
  tree-id:
    description: 'The code-tree id of HEAD'
    value: ${{ steps.id.outputs.tree-id }}
  reused:
    description: "mode 'check': 'true' when this run may skip its work, the same code having been validated"
    value: ${{ steps.verdict.outputs.reused }}
  reason:
    description: "mode 'check': why the run reuses a validation or builds"
    value: ${{ steps.verdict.outputs.reason }}
  recorded-commit:
    description: "mode 'check', on reuse: the commit whose run recorded the validation"
    value: ${{ steps.verdict.outputs.recorded-commit }}
  recorded-note:
    description: "mode 'check', on reuse: the note recorded with the validation"
    value: ${{ steps.verdict.outputs.recorded-note }}

runs:
  using: composite
  steps:
    - name: Code-tree id
      id: id
      shell: bash
      env:
        GIVEN: ${{ inputs.tree-id }}
        SCRIPT: ${{ github.action_path }}/validated_tree.py
      run: |
        set -euo pipefail
        if [ -n "$GIVEN" ]; then id="$GIVEN"; else id=$(python3 "$SCRIPT" id); fi
        echo "tree-id=$id" >> "$GITHUB_OUTPUT"
        echo "Code-tree id: $id"

    - name: May this run reuse a validation?
      id: eligible
      if: inputs.mode == 'check'
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        ATTEMPT: ${{ github.run_attempt }}
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REF: ${{ github.head_ref }}
        API: ${{ github.server_url }}/api/v1
        TOKEN: ${{ inputs.bot-token }}
        SCRIPT: ${{ github.action_path }}/validated_tree.py
      run: |
        set -euo pipefail
        python3 "$SCRIPT" check --event "$EVENT" --attempt "${ATTEMPT:-${GITHUB_RUN_ATTEMPT:-}}" \
          --owner "$OWNER" --repo "${REPOSITORY#*/}" --branch "$HEAD_REF" --api "$API" --token "$TOKEN" \
          | tee -a "$GITHUB_OUTPUT"

    # A record is a ref of the repository itself, refs/validated/<scope>/<id>[-<suffix>] (validated_tree.py): every
    # runner sees it, where the actions cache is per runner (Vidocq/ci#57, Vidocq/vidocq#362). Whatever must invalidate
    # a record goes into the ref name (key-suffix); a later record of the same ref replaces it.
    - name: Look the validation up
      id: lookup
      if: inputs.mode == 'check' && steps.eligible.outputs.eligible == 'true'
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        TREE: ${{ steps.id.outputs.tree-id }}
        SUFFIX: ${{ inputs.key-suffix }}
        TOKEN: ${{ inputs.bot-token }}
        SERVER: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        SCRIPT: ${{ github.action_path }}/validated_tree.py
      run: |
        set -euo pipefail
        if [ -n "$TOKEN" ]; then remote="${SERVER/https:\/\//https://oauth2:${TOKEN}@}/${REPOSITORY}.git"
        else remote="${SERVER%/}/${REPOSITORY}.git"; fi
        ref=$(python3 "$SCRIPT" ref --scope "$SCOPE" --tree-id "$TREE" --suffix "$SUFFIX")
        echo "Record: $ref"
        python3 "$SCRIPT" lookup --remote "$remote" --ref "$ref" | tee -a "$GITHUB_OUTPUT"

    - name: Verdict
      id: verdict
      if: inputs.mode == 'check'
      shell: bash
      env:
        ELIGIBLE: ${{ steps.eligible.outputs.eligible }}
        WHY: ${{ steps.eligible.outputs.reason }}
        FOUND: ${{ steps.lookup.outputs.found }}
        COMMIT: ${{ steps.lookup.outputs.recorded-commit }}
        NOTE: ${{ steps.lookup.outputs.recorded-note }}
        SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        if [ "$ELIGIBLE" != true ]; then
          reused=false; reason="builds: $WHY"
        elif [ "$FOUND" = true ]; then
          echo "recorded-commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "recorded-note=$NOTE" >> "$GITHUB_OUTPUT"
          reused=true; reason="this code tree was already validated ($SCOPE, commit ${COMMIT:0:8}): nothing to build again"
        else
          reused=false; reason="builds: this code tree was never validated ($SCOPE)"
        fi
        echo "reused=$reused" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        echo "::notice title=Validated tree::$reason"

    - name: Record what was validated
      # Needs the bot token (push); a run without it (a pull request from a fork) records nothing.
      if: inputs.mode == 'record' && inputs.bot-token != ''
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        TREE: ${{ steps.id.outputs.tree-id }}
        SUFFIX: ${{ inputs.key-suffix }}
        TOKEN: ${{ inputs.bot-token }}
        SERVER: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        NOTE: ${{ inputs.note }}
        SCRIPT: ${{ github.action_path }}/validated_tree.py
      run: |
        set -euo pipefail
        remote="${SERVER/https:\/\//https://oauth2:${TOKEN}@}/${REPOSITORY}.git"
        ref=$(python3 "$SCRIPT" ref --scope "$SCOPE" --tree-id "$TREE" --suffix "$SUFFIX")
        python3 "$SCRIPT" record --remote "$remote" --ref "$ref" --commit "$SHA" --run "$RUN" --note "$NOTE"
        echo "Recorded $ref (commit ${SHA:0:8})"
