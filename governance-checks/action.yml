name: 'Governance checks (CLA, GPG, sign-off)'
description: 'Verify the PR author signed the Vidocq CLA and every PR commit is GPG-signed and carries a Signed-off-by trailer'

# ⚠️ DEPRECATED — kept working for repos not yet migrated, but new/updated
# workflows should use the 3 split actions instead: cla-check, gpg-check,
# dco-check. Bundling all 3 checks into a single job means a single status
# check context ("… / governance-checks") that fails for any of 3 unrelated
# reasons, and — the immediate motivation for the split — a merge-bot re-sign
# only invalidates the GPG check, not CLA/DCO, so re-running only gpg-check
# after a merge-bot pass is both faster and clearer than re-running all 3.
#
# Single shared implementation of the per-PR contribution gate. Forgejo/Codeberg does not
# resolve cross-repo reusable workflows (jobs.<id>.uses:), so the checks live in a composite
# action (step-level uses:, which Codeberg does support) instead of a workflow_call workflow.
#
# The CLA signatures and the contributors' GPG public keys live in the public Vidocq/governance
# repository, cloned at run time. The calling job MUST check out its repository with
# fetch-depth: 0 so the GPG and sign-off checks can read the full BASE_REF..HEAD commit range.

inputs:
  pr-author:
    description: 'Codeberg username of the pull request author (e.g. github.event.pull_request.user.login)'
    required: true
  slack-webhook:
    description: 'Optional Slack incoming webhook (SLACK_WEBHOOK_URL). When set, a CLA rejection posts a [ViBot] alert.'
    default: ''

runs:
  using: composite
  steps:
    - name: Fetch the governance repository (CLA signatures + GPG keys)
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/governance"
        git clone --depth 1 "${GITHUB_SERVER_URL%/}/Vidocq/governance" "$RUNNER_TEMP/governance"

    - name: Check CLA signature
      shell: bash
      env:
        PR_AUTHOR: ${{ inputs.pr-author }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
        REPO: ${{ github.repository }}
        PR_NUM: ${{ github.event.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        set -euo pipefail
        if [ -z "${PR_AUTHOR:-}" ]; then
          echo "::error::pr-author input is empty — cannot verify the CLA signature."
          exit 1
        fi
        # Match the '@<login>' token in the 'Codeberg Username' column, bounded so one login
        # cannot match as a substring of another.
        if grep -qiE "@${PR_AUTHOR}([^[:alnum:]_-]|$)" "$RUNNER_TEMP/governance/CLA-signatures/individuals.md"; then
          echo "✅ CLA signed by @${PR_AUTHOR}"
          exit 0
        fi

        # The PR author's account may have been deleted after the PR was opened
        # (Forgejo then reports the login as "Ghost"), which would otherwise
        # permanently reject a contribution from someone who legitimately signed
        # the CLA beforehand. As a narrow fallback for this specific case, match
        # every commit author's name (preserved in git history regardless of
        # account deletion) against the "Full Name" column instead of the
        # now-unrecoverable login. Only attempted when the login itself is the
        # deleted-account placeholder, never as a general substitute for the
        # login check.
        if [ "${PR_AUTHOR}" = "Ghost" ]; then
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch --quiet origin "$base_ref" 2>/dev/null || true
          all_signed=true
          any_commit=false
          while IFS= read -r author_name; do
            [ -n "$author_name" ] || continue
            any_commit=true
            grep -qiF "| ${author_name} |" "$RUNNER_TEMP/governance/CLA-signatures/individuals.md" \
              || all_signed=false
          done < <(git log "origin/${base_ref}..HEAD" --format='%an' | sort -u)
          if [ "$any_commit" = true ] && [ "$all_signed" = true ]; then
            echo "✅ CLA signed (matched by commit author name — the PR author's account was deleted)"
            exit 0
          fi
        fi

        echo "❌ @${PR_AUTHOR} has not signed the Vidocq CLA."
        echo ""
        echo "Please open a separate pull request on Vidocq/governance adding your name to"
        echo "CLA-signatures/individuals.md."
        echo "See https://codefloe.com/Vidocq/governance/src/branch/main/CONTRIBUTING.md"
        # CLA-specific Slack alert (best-effort; never masks the rejection exit code).
        if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
          payload=$(node <<'JS'
        const repo = process.env.REPO, num = process.env.PR_NUM;
        const url = process.env.PR_URL, author = process.env.PR_AUTHOR;
        const where = (repo ? `\`${repo}\`` : 'a repository') + (num ? `#${num}` : '');
        const link = url ? `\n<${url}|View PR>` : '';
        const text = `[ViBot]: 🚫 *PR REJECTED FOR CLA* — @${author} has not signed the Vidocq CLA on ${where}${link}`;
        process.stdout.write(JSON.stringify({ text }));
        JS
        )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload" \
            && echo "📣 Slack CLA-rejection alert sent" || echo "⚠️ Slack CLA-rejection alert failed (non-fatal)"
        fi
        exit 1

    - name: Check GPG signatures on all PR commits
      shell: bash
      run: |
        set -euo pipefail
        # Import contributors' public keys (same step as verification so the keyring is in scope).
        for keyfile in "$RUNNER_TEMP"/governance/.forgejo/keys/*.asc; do
          [ -f "$keyfile" ] || continue
          gpg --import "$keyfile" 2>/dev/null && echo "Imported: $(basename "$keyfile")" || true
        done

        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE_REF="origin/$GITHUB_BASE_REF"
        elif git show-ref --verify --quiet refs/remotes/origin/HEAD; then
          BASE_REF="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
        else
          BASE_REF="origin/main"
        fi

        # A commit produced by the forge's own web "Update branch" button (merge mode):
        # exactly two parents, author identical to committer, an author address under
        # @noreply.codefloe.com and a "Merge branch '…' into …" subject. Such a commit
        # still fails — a forge signs nothing, and exempting it would let any unsigned
        # merge through — but the remedy to print is not the contributor's GPG setup.
        # Every field is read with its own `git log -1`, so a subject containing spaces
        # or quotes cannot shift the parsing.
        is_forge_update_commit() {
          local hash="$1" parents author_name author_email committer_name committer_email subject
          parents="$(git log -1 --format='%P' "$hash")"
          set -- $parents
          [ "$#" -eq 2 ] || return 1
          author_name="$(git log -1 --format='%an' "$hash")"
          author_email="$(git log -1 --format='%ae' "$hash")"
          committer_name="$(git log -1 --format='%cn' "$hash")"
          committer_email="$(git log -1 --format='%ce' "$hash")"
          [ "$author_name" = "$committer_name" ] || return 1
          [ "$author_email" = "$committer_email" ] || return 1
          case "$author_email" in *@noreply.codefloe.com) ;; *) return 1 ;; esac
          subject="$(git log -1 --format='%s' "$hash")"
          case "$subject" in "Merge branch '"*"' into "*) ;; *) return 1 ;; esac
          return 0
        }

        UNSIGNED_FORGE=""
        UNSIGNED_OTHER=""
        while IFS= read -r hash; do
          [ -n "$hash" ] || continue
          git verify-commit "$hash" 2>/dev/null && continue
          email="$(git log -1 --format='%ae' "$hash")"
          if is_forge_update_commit "$hash"; then
            UNSIGNED_FORGE="${UNSIGNED_FORGE}  $hash ($email) $(git log -1 --format='%s' "$hash")"$'\n'
          else
            UNSIGNED_OTHER="${UNSIGNED_OTHER}  $hash ($email)"$'\n'
          fi
        done < <(git log "$BASE_REF"..HEAD --format='%H')

        FAILED=0
        if [ -n "$UNSIGNED_OTHER" ]; then
          echo "❌ The following commits are not GPG-signed or have invalid signatures:"
          printf '%s' "$UNSIGNED_OTHER"
          echo ""
          echo "All commits must be GPG-signed."
          echo "See https://codefloe.com/Vidocq/governance/src/branch/main/CONTRIBUTING.md#set-up-gpg-commit-signing"
          echo ""
          FAILED=1
        fi
        if [ -n "$UNSIGNED_FORGE" ]; then
          echo "❌ The following commits are not GPG-signed and were created by the forge itself:"
          printf '%s' "$UNSIGNED_FORGE"
          echo ""
          echo "This commit was created by the web \"Update branch\" button, not by you."
          echo "A forge signs nothing when it merges on the server, and its rebase mode"
          echo "would strip the signatures from your other commits instead."
          echo "Comment '/rebase' on this pull request: the merge-bot will rebase the branch,"
          echo "re-sign every commit with the CI key and force-push, leaving the pull request"
          echo "open."
          echo ""
          FAILED=1
        fi
        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi
        echo "✅ All commits are correctly GPG-signed"

    - name: Check Signed-off-by on all PR commits
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE_REF="origin/$GITHUB_BASE_REF"
        elif git show-ref --verify --quiet refs/remotes/origin/HEAD; then
          BASE_REF="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
        else
          BASE_REF="origin/main"
        fi

        # A commit produced by the forge's own web "Update branch" button (merge mode):
        # exactly two parents, author identical to committer, an author address under
        # @noreply.codefloe.com and a "Merge branch '…' into …" subject. Such a commit
        # still fails — exempting it would let any trailer-less merge through — but the
        # remedy to print is not the contributor's git configuration, since the commit
        # was never made on their machine. Every field is read with its own `git log -1`,
        # so a subject containing spaces or quotes cannot shift the parsing.
        is_forge_update_commit() {
          local hash="$1" parents author_name author_email committer_name committer_email subject
          parents="$(git log -1 --format='%P' "$hash")"
          set -- $parents
          [ "$#" -eq 2 ] || return 1
          author_name="$(git log -1 --format='%an' "$hash")"
          author_email="$(git log -1 --format='%ae' "$hash")"
          committer_name="$(git log -1 --format='%cn' "$hash")"
          committer_email="$(git log -1 --format='%ce' "$hash")"
          [ "$author_name" = "$committer_name" ] || return 1
          [ "$author_email" = "$committer_email" ] || return 1
          case "$author_email" in *@noreply.codefloe.com) ;; *) return 1 ;; esac
          subject="$(git log -1 --format='%s' "$hash")"
          case "$subject" in "Merge branch '"*"' into "*) ;; *) return 1 ;; esac
          return 0
        }

        MISSING_FORGE=""
        MISSING_OTHER=""
        while IFS= read -r hash; do
          [ -n "$hash" ] || continue
          if git log -1 --format='%B' "$hash" | grep -q "^Signed-off-by:"; then
            continue
          fi
          if is_forge_update_commit "$hash"; then
            MISSING_FORGE="${MISSING_FORGE}  $hash ($(git log -1 --format='%ae' "$hash")) $(git log -1 --format='%s' "$hash")"$'\n'
          else
            MISSING_OTHER="${MISSING_OTHER}  $hash"$'\n'
          fi
        done < <(git log "$BASE_REF"..HEAD --format='%H')

        FAILED=0
        if [ -n "$MISSING_OTHER" ]; then
          echo "❌ The following commits are missing a Signed-off-by trailer:"
          printf '%s' "$MISSING_OTHER"
          echo ""
          echo "Use: git config --local format.signoff true   (or: git commit --signoff)"
          echo ""
          FAILED=1
        fi
        if [ -n "$MISSING_FORGE" ]; then
          echo "❌ The following commits have no Signed-off-by trailer and were created by the forge itself:"
          printf '%s' "$MISSING_FORGE"
          echo ""
          echo "This commit was created by the web \"Update branch\" button, not by you."
          echo "A forge adds no trailer when it merges on the server, so 'format.signoff'"
          echo "would have changed nothing here, and its rebase mode would strip the GPG"
          echo "signatures from your other commits instead."
          echo "Comment '/rebase' on this pull request: the merge-bot will rebase the branch,"
          echo "re-sign every commit with the CI key and force-push, leaving the pull request"
          echo "open."
          echo ""
          FAILED=1
        fi
        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi
        echo "✅ All commits have a Signed-off-by trailer"
