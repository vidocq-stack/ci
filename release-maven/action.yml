name: 'Release to Maven Central'
description: |
  Orchestrate a full Maven Central release on a dedicated `release/{version}` branch:
  lock io.vidocq.* SNAPSHOTs via overrides, fail-fast if any remain, set the release
  version, build, deploy via central-publishing (with optional module exclusions),
  tag, bump main to the next dev version, and block until every deployable artifact
  is visible on repo1.maven.org.

  Main is never moved before the deploy succeeds — a failed release leaves main bit-for-bit
  identical to its pre-release state, with the `release/{version}` branch on the remote
  as the audit trail.

  Caller must have already checked out the repo with fetch-depth: 0 and a token capable
  of pushing tags + commits (typically secrets.VIDOCQ_BOT_TOKEN).

inputs:
  release-version:
    description: 'Release version (e.g. 1.0.0, 0.1.0). Without -SNAPSHOT.'
    required: true
  next-dev-version:
    description: 'Next development version, WITHOUT -SNAPSHOT (e.g. 0.2.0). The script appends -SNAPSHOT automatically.'
    required: true
  overrides:
    description: |
      Multiline list of "groupId:artifactId=version" entries to apply BEFORE release.
      One per line. Used to lock io.vidocq.* SNAPSHOT deps (incl. <parent>) to their
      release versions. Leave empty for projects with no inter-project SNAPSHOT deps
      (e.g. vidocq-parent itself).
    required: false
    default: ''
  excluded-modules:
    description: |
      Newline-separated list of reactor module artifactIds to EXCLUDE from `mvn deploy`
      (typically: examples, TCK runners, test suites — modules that compile and validate
      the project but are not meant to land on Maven Central). Passed verbatim to
      `mvn -pl !a,!b,!c` during the deploy step. Empty (default) → every reactor module
      is deployed.
    required: false
    default: ''
  central-username:
    description: 'Sonatype Central Portal username (secrets.CENTRAL_USERNAME)'
    required: true
  central-password:
    description: 'Sonatype Central Portal password/token (secrets.CENTRAL_PASSWORD)'
    required: true
  gpg-private-key:
    description: 'GPG private key, ASCII-armored or base64-encoded (secrets.GPG_PRIVATE_KEY)'
    required: true
  gpg-passphrase:
    description: 'GPG key passphrase (secrets.GPG_PASSPHRASE)'
    required: true
  gpg-key-id:
    description: 'GPG key id (long format, secrets.GPG_KEY_ID). Used as --default-key.'
    required: true
  bot-token:
    description: |
      Codeberg/Forgejo token with push access to the project repo (secrets.VIDOCQ_BOT_TOKEN).
      Required: the release script pushes the `release/{version}` branch, the `v{version}`
      tag, and the post-release `main` bump. POMs declare ssh://git@codeberg.org/... as
      developerConnection; the runner has no SSH key for Codeberg, so we re-route
      SSH→HTTPS+token using `git config insteadOf`.
    required: true
  bot-name:
    description: 'Git author name for the release + bump commits'
    default: 'Vidocq CI Bot'
  bot-email:
    description: 'Git author email for the release + bump commits'
    default: 'ci@vidocq.io'
  git-signing-private-key:
    description: |
      GPG private key (ASCII-armored), dedicated to signing the bot's git commits
      (secrets.CI_BOT_GPG_PRIVATE_KEY). Separate from gpg-private-key, which only
      signs Maven artifacts. When empty, the release: and post-release: commits are
      pushed unsigned (fails branch protection on repos with require_signed_commits).
    required: false
    default: ''
  git-signing-passphrase:
    description: 'Passphrase for git-signing-private-key (secrets.CI_BOT_GPG_PASSPHRASE)'
    required: false
    default: ''
  git-signing-key-id:
    description: 'Long key id of git-signing-private-key (secrets.CI_BOT_GPG_KEY_ID)'
    required: false
    default: ''
  release-profile:
    description: 'Maven profile activated during the deploy step (must publish via central-publishing)'
    default: 'release'
  wait-timeout-seconds:
    description: 'Max seconds to wait for Central propagation (per artifact). Default 3600 (60 min).'
    default: '3600'
  wait-interval-seconds:
    description: 'Polling interval for Central propagation. Default 60s.'
    default: '60'
  dry-run:
    description: |
      "true" → run the full pipeline locally on the release/{version} branch (POM mutations,
      version bump, build, sign + bundle via `mvn verify`) but DO NOT push the branch, DO NOT
      push the tag, DO NOT upload to Central, DO NOT touch main. Useful as a smoke test before
      the real release.
    default: 'false'
  auto-publish:
    description: |
      "true" → after the bundle is uploaded and Sonatype validates it, publish
      it automatically (no manual click on central.sonatype.com required), and
      wait-for-Central polls repo1.maven.org until propagation.
      "false" (default) → bundle stays in state VALIDATED on the Portal, waiting
      for a human to click "Publish". wait-for-Central is skipped in that case.
    default: 'false'
  java-version:
    description: 'Temurin JDK version'
    default: '25'
  maven-version:
    description: 'Maven version (used in https://dlcdn.apache.org/maven/maven-${major}/${version}/binaries/)'
    default: '3.9.16'

runs:
  using: composite
  steps:
    # Setup Java + Maven inline rather than `uses: ci/setup-maven@v1` so the
    # runner makes ONE clone of Vidocq/ci instead of two — under Codeberg
    # rate-limiting (504 on burst clones after a force-tag) this is the
    # difference between green and red.
    - name: Set up Java ${{ inputs.java-version }} (temurin)
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        # IMPORTANT: do NOT set `cache: maven` here. On the Forgejo runner
        # (act_runner v11.x), the cache restore extracts its tarball with
        # `tar -xf cache.tgz -P -C /workspace/<repo>`, which leaks .m2/ files
        # INTO the workspace and trips the release.sh precheck
        # ("working tree is dirty"). A release is rare; the extra ~30s of
        # Maven download is acceptable for a clean worktree.

    - name: Install Maven ${{ inputs.maven-version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        major="${MAVEN_VERSION%%.*}"
        url="https://dlcdn.apache.org/maven/maven-${major}/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        echo "Downloading Maven ${MAVEN_VERSION} from ${url}"
        wget -q "$url"
        tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C /opt
        echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Run release pipeline
      shell: bash
      env:
        RELEASE_VERSION:       ${{ inputs.release-version }}
        NEXT_DEV_VERSION:      ${{ inputs.next-dev-version }}
        OVERRIDES:             ${{ inputs.overrides }}
        EXCLUDED_MODULES:      ${{ inputs.excluded-modules }}
        CENTRAL_USERNAME:      ${{ inputs.central-username }}
        CENTRAL_PASSWORD:      ${{ inputs.central-password }}
        GPG_PRIVATE_KEY:       ${{ inputs.gpg-private-key }}
        GPG_PASSPHRASE:        ${{ inputs.gpg-passphrase }}
        GPG_KEY_ID:            ${{ inputs.gpg-key-id }}
        BOT_NAME:              ${{ inputs.bot-name }}
        BOT_EMAIL:             ${{ inputs.bot-email }}
        GIT_SIGNING_PRIVATE_KEY: ${{ inputs.git-signing-private-key }}
        GIT_SIGNING_PASSPHRASE:  ${{ inputs.git-signing-passphrase }}
        GIT_SIGNING_KEY_ID:      ${{ inputs.git-signing-key-id }}
        RELEASE_PROFILE:       ${{ inputs.release-profile }}
        WAIT_TIMEOUT_SECONDS:  ${{ inputs.wait-timeout-seconds }}
        WAIT_INTERVAL_SECONDS: ${{ inputs.wait-interval-seconds }}
        DRY_RUN:               ${{ inputs.dry-run }}
        AUTO_PUBLISH:          ${{ inputs.auto-publish }}
        BOT_TOKEN:             ${{ inputs.bot-token }}
      run: bash "${{ github.action_path }}/release.sh"

    # Once the release is in (tag pushed, main bumped to next-dev), notify
    # every downstream consumer so they regenerate their own release.yml
    # against the freshly released version. Without this cascade, the
    # `default:` values of their *_release inputs (queried at bootstrap
    # time from repo1.maven.org) stay frozen to the previous release.
    # Skipped on dry-run (nothing was published, so nothing to propagate).
    - name: Trigger downstream release.yml refresh
      if: success() && inputs.dry-run != 'true'
      uses: https://codefloe.com/Vidocq/ci/refresh-downstream-release-yml@main
      with:
        producer-slug: ${{ github.repository }}
        bot-token:     ${{ inputs.bot-token }}
