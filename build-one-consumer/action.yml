name: 'Build one downstream consumer (flat mode)'
description: >
  PR-only, one job per consumer (a matrix fed by resolve-impacted): rebuild the producer under
  pull request at its PR version in this job, without its tests, then build ONE consumer
  against it, with its tests. Flat mode: only the producer's version is pinned in the consumer;
  every other io.vidocq upstream comes from central-snapshots as published, which is what
  Central holds right after the producer is merged. An intermediate upstream that has a
  companion branch for the pull request is rebuilt first, in this job (mini-chain).
  Needs the producer checked out (actions/checkout) and Java + Maven on the PATH (setup-maven).

inputs:
  consumer:
    description: 'Forge slug of the consumer to build, e.g. Vidocq/foy (pass ${{ matrix.repo }})'
    required: true
  upstreams:
    description: >
      The impacted intermediate upstreams of the consumer, space-separated, in topological order
      (pass fromJSON(needs.<impacted job>.outputs.upstreams)[matrix.repo]). Only those that have
      the companion branch are rebuilt; empty: none.
    default: ''
  producer-slug:
    description: 'Forge slug of the repo under PR, e.g. Vidocq/vauban (pass ${{ github.repository }})'
    required: true
  producer-version:
    description: 'Release-style PR version of the producer (no -SNAPSHOT); rebuilt and installed by this action'
    required: true
  version-suffix:
    description: 'Suffix appended to the consumer base version, e.g. PR42.abc12345 (no -SNAPSHOT)'
    required: true
  producer-dir:
    description: 'Directory of the producer checkout'
    default: '.'
  producer-maven-args:
    description: 'Maven args of the producer rebuild (versions:set, then install -DskipTests)'
    default: '-B -ntp'
  maven-args:
    description: >
      Maven args of the consumer build. The default reruns a failing test once (surefire and
      failsafe); a test that then passes is reported as flaky, as in build-impacted. A value
      given here replaces the whole default.
    default: '-B -ntp -Dsurefire.rerunFailingTestsCount=1 -Dfailsafe.rerunFailingTestsCount=1'
  companion-branches:
    description: >
      Build the consumer, and rebuild its intermediate upstreams, on the branch named like the
      PR's head branch when they have one. PR from a branch of the producer repo only, never
      from a fork. 'false' turns it off.
    default: 'true'
  producer-artifacts:
    description: >
      Name of the run artifact the producer job shared (producer-artifacts, mode publish; e.g.
      producer-artifacts-${{ github.run_id }}). When set, the producer artifacts are downloaded with
      the job token, checked against their manifest (version, the producer's modules, sha256 of
      every file) and installed, instead of rebuilding the producer; any problem falls back to the
      rebuild, with a notice. Empty (default): the producer is rebuilt in this job, as before.
    default: ''
  tests:
    description: >
      'full' (default): every test of the consumer runs, as always. 'targeted': the consumer
      still compiles, test-compiles, packages and installs every module in the same single
      install, but test execution is turned off in the modules whose build cannot see any
      artifact of the producer (effective-POM analysis, build-one-consumer/targeted/). Falls back
      to 'full' on any doubt (a companion branch for the consumer or an intermediate upstream, analysis or Maven
      error...), with the reason in the job summary.
    default: 'full'
  baseline-on-failure:
    description: >
      'false' (default): a failing consumer build fails the job, as always. 'true': when it fails,
      the same consumer commit is rebuilt against the producer's current main SNAPSHOT (baseline,
      same intermediates, same skip set) and the pull-request build again, both with -fae and
      test failures ignored; the job passes, with a warning and a job-summary section, only when
      every failure (test case, invoker build, build error by module and goal) also fails on the
      baseline. Never on a companion-branch run. Costs one more consumer build when the failure is
      the pull request's, two when it is pre-existing; nothing when the build passes.
    default: 'false'
  graph-pruning:
    description: >
      tests=targeted only. 'true': trust the dependency graph to skip the closure resolution of
      the external artifacts of repositories that do not consume the producer (about 60 s faster
      on vidocq, but the graph is not checked for freshness or version skew). 'false' (default):
      every suspect external io.vidocq artifact gets its closure resolved.
    default: 'false'
  graph-repo:
    description: 'owner/name of the PUBLIC dependency-graph repo (graph-pruning: true only)'
    default: 'Vidocq/dep-graph'
  graph-ref:
    description: 'Branch of the dependency-graph repo (graph-pruning: true only)'
    default: 'main'
  bot-token:
    description: 'Optional Codefloe token (VIDOCQ_BOT_TOKEN), only for clone rate limits; empty on fork PRs'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Rebuild the producer at its PR version (no tests)
      shell: bash
      env:
        PRODUCER_VERSION: ${{ inputs.producer-version }}
        PRODUCER_DIR: ${{ inputs.producer-dir }}
        PRODUCER_MVN_ARGS: ${{ inputs.producer-maven-args }}
        TESTS: ${{ inputs.tests }}
        PRODUCER_ARTIFACTS_NAME: ${{ inputs.producer-artifacts }}
        ARTIFACTS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        ARTIFACTS_RUN: ${{ github.run_id }}
        ARTIFACTS_TOKEN: ${{ github.token }}
        SHARED: ${{ github.action_path }}/../build-impacted
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
        fi
        bash "${ACTION_PATH}/rebuild-producer.sh"

    - name: Build ${{ inputs.consumer }} against the PR producer (flat)
      shell: bash
      env:
        CONSUMER: ${{ inputs.consumer }}
        UPSTREAMS: ${{ inputs.upstreams }}
        PRODUCER_SLUG: ${{ inputs.producer-slug }}
        PRODUCER_VERSION: ${{ inputs.producer-version }}
        VERSION_SUFFIX: ${{ inputs.version-suffix }}
        MVN_ARGS: ${{ inputs.maven-args }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        COMPANION_BRANCHES: ${{ inputs.companion-branches }}
        TESTS: ${{ inputs.tests }}
        BASELINE_ON_FAILURE: ${{ inputs.baseline-on-failure }}
        GRAPH_PRUNING: ${{ inputs.graph-pruning }}
        GRAPH_REPO: ${{ inputs.graph-repo }}
        GRAPH_REF: ${{ inputs.graph-ref }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SHARED: ${{ github.action_path }}/../build-impacted
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/build-consumer.sh"

    # Same report as build-impacted: a test that failed, then passed on rerun, becomes a warning
    # and a row of the job summary. Only reports, never fails.
    - name: Report flaky tests of the consumer build
      if: always()
      shell: bash
      env:
        SHARED: ${{ github.action_path }}/../build-impacted
      run: |
        set -uo pipefail
        list="${RUNNER_TEMP:-/tmp}/downstream-logs/consumers.tsv"
        if [ ! -s "$list" ]; then
          echo "No consumer build log to read."
          exit 0
        fi
        args=()
        while IFS=$'\t' read -r slug log; do args+=("${slug}=${log}"); done < "$list"
        python3 "$SHARED/flakes.py" "${args[@]}" || true
