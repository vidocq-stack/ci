name: 'Notify Slack (ViBot)'
description: 'Post a [ViBot] notification to Slack via an incoming webhook. Silent when the webhook is missing for status=success; fails otherwise.'

inputs:
  webhook-url:
    description: 'Slack incoming webhook URL (SLACK_WEBHOOK_URL)'
    required: true
  status:
    description: 'success | failure | pr-open | pr-merged | pr-validated | release-success | release-failure'
    required: true
  repo:
    description: 'Repository slug (github.repository)'
    default: ''
  ref:
    description: 'Branch / ref (github.ref_name)'
    default: ''
  run-url:
    description: 'CI run URL'
    default: ''
  version:
    description: '(success, optional) project version'
    default: ''
  sha:
    description: '(success, optional) commit SHA'
    default: ''
  commit-message:
    description: '(success, optional) commit message'
    default: ''
  commit-author:
    description: '(success, optional) commit author'
    default: ''
  pr-number:
    description: '(pr-*, optional) pull request number'
    default: ''
  pr-title:
    description: '(pr-*, optional) pull request title'
    default: ''
  pr-author:
    description: '(pr-*, optional) pull request author'
    default: ''
  pr-url:
    description: '(pr-*, optional) pull request URL'
    default: ''
  merged-by:
    description: '(pr-merged, optional) who merged the PR'
    default: ''
  base-ref:
    description: '(pr-merged, optional) base branch of the PR'
    default: ''
  release-version:
    description: '(release-*, required for release statuses) released version, e.g. 1.0.0'
    default: ''
  next-dev-version:
    description: '(release-success, optional) next development version, e.g. 1.1.0-SNAPSHOT'
    default: ''
  release-tag-url:
    description: '(release-*, optional) URL to the git tag page'
    default: ''
  dry-run:
    description: 'When truthy (true/1/yes), the notification is rendered with a big "🧪 DRY RUN 🧪" header (Slack Block Kit) and a contextual banner so the channel sees at a glance that no real publication / no real merge happened.'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Notify Slack
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
        STATUS: ${{ inputs.status }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        RUN_URL: ${{ inputs.run-url }}
        VERSION: ${{ inputs.version }}
        SHA: ${{ inputs.sha }}
        COMMIT_MSG: ${{ inputs.commit-message }}
        COMMIT_AUTHOR: ${{ inputs.commit-author }}
        PR_NUM: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        PR_URL: ${{ inputs.pr-url }}
        PR_MERGED_BY: ${{ inputs.merged-by }}
        BASE_REF: ${{ inputs.base-ref }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        NEXT_DEV_VERSION: ${{ inputs.next-dev-version }}
        RELEASE_TAG_URL: ${{ inputs.release-tag-url }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
          if [ "$STATUS" = "success" ] || [ "$STATUS" = "release-success" ]; then
            echo "ℹ️ SLACK_WEBHOOK_URL missing — '$STATUS' notification skipped"
            exit 0
          fi
          echo "❌ SLACK_WEBHOOK_URL missing — cannot send '$STATUS' notification" >&2
          exit 1
        fi
        export SHORT_SHA="${SHA:0:7}"
        payload=$(node <<'JS'
        const s = process.env.STATUS;
        const repo = process.env.REPO, ref = process.env.REF, runUrl = process.env.RUN_URL;
        const prNum = process.env.PR_NUM, prTitle = process.env.PR_TITLE;
        const prAuthor = process.env.PR_AUTHOR, prUrl = process.env.PR_URL;
        let text;
        switch (s) {
          case 'failure':
            text = `[ViBot]: ❌ *CI build failed* — \`${repo}\`@${ref}\n<${runUrl}|View run>`;
            break;
          case 'pr-open':
            text = `[ViBot]: 📬 *PR opened* on \`${repo}\`#${prNum} by *${prAuthor}*\n> ${prTitle}\n<${prUrl}|View PR>`;
            break;
          case 'pr-merged': {
            const mergedBy = process.env.PR_MERGED_BY || prAuthor;
            text = `[ViBot]: 🎉 *PR merged* into \`${repo}\`@${process.env.BASE_REF} (#${prNum}, author *${prAuthor}*, merged by *${mergedBy}*)\n> ${prTitle}\n<${prUrl}|View PR>`;
            break;
          }
          case 'pr-validated':
            text = `[ViBot]: ✅ *PR validated* — \`${repo}\`#${prNum} by *${prAuthor}*\n> ${prTitle}\n<${prUrl}|View PR>`;
            break;
          case 'release-success': {
            const rv = process.env.RELEASE_VERSION;
            const nd = process.env.NEXT_DEV_VERSION;
            const tagUrl = process.env.RELEASE_TAG_URL;
            const nextLine = nd ? ` · next dev \`${nd}\`` : '';
            const tagLine  = tagUrl ? ` · <${tagUrl}|tag v${rv}>` : '';
            text = `[ViBot]: 🚀 *Released* \`${repo}\` *${rv}*${nextLine}${tagLine}\n<${runUrl}|View run>`;
            break;
          }
          case 'release-failure': {
            const rv = process.env.RELEASE_VERSION || '(unknown)';
            text = `[ViBot]: 💥 *Release failed* — \`${repo}\` ${rv}\n<${runUrl}|View run>`;
            break;
          }
          default: { // success
            const v = process.env.VERSION ? ` (v${process.env.VERSION})` : '';
            const subject = (process.env.COMMIT_MSG || '').split('\n')[0];
            const author = process.env.COMMIT_AUTHOR ? ` by *${process.env.COMMIT_AUTHOR}*` : '';
            const line = process.env.SHORT_SHA
              ? `\n> \`${process.env.SHORT_SHA}\`${author}${subject ? ` — _${subject}_` : ''}`
              : '';
            text = `[ViBot]: ✅ *CI build passed* — \`${repo}\`@${ref}${v}${line}\n<${runUrl}|View run>`;
          }
        }
        // When dry-run is truthy, wrap the message in Block Kit so a big
        // "🧪 DRY RUN 🧪" header sits on top — `*bold*` alone doesn't grow
        // the font; only Block Kit `header` blocks do.
        const dry = /^(1|true|yes|on)$/i.test(process.env.DRY_RUN || '');
        if (dry) {
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: 🧪 DRY RUN — ${text.replace(/^\[ViBot\]:\s*/, '')}`,
            blocks: [
              { type: 'header', text: { type: 'plain_text', text: '🧪 DRY RUN 🧪', emoji: true } },
              { type: 'context', elements: [ { type: 'mrkdwn', text: ':warning: *No real publication / no real merge.* This is a simulated CI run.' } ] },
              { type: 'divider' },
              { type: 'section', text: { type: 'mrkdwn', text } }
            ]
          }));
        } else {
          process.stdout.write(JSON.stringify({ text }));
        }
        JS
        )
        curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "$payload"
