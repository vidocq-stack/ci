name: 'Merge-bot (rebase + re-sign + optional fast-forward)'
description: >-
  Rebase a pull request's head branch onto its base, re-sign every replayed
  commit with the dedicated CI bot GPG key, force-push, then (unless
  merge: 'false') fast-forward merge via the Forgejo API. This is the only
  way to update or merge a PR without producing an unsigned commit once
  require_signed_commits is enforced, since every git-forge (Forgejo,
  GitHub, GitLab included) strips the original signatures on any
  server-side merge/squash/rebase.

inputs:
  pr-number:
    description: 'Pull request number to merge (e.g. github.event.issue.number)'
    required: true
  repo:
    description: 'owner/name of the repository (github.repository)'
    required: true
  base-url:
    description: 'Forge base URL'
    default: 'https://codefloe.com'
  bot-token:
    description: 'Token with write access to the repo (secrets.VIDOCQ_BOT_TOKEN)'
    required: true
  git-signing-private-key:
    description: 'CI bot GPG private key, ASCII-armored or base64 (secrets.CI_BOT_GPG_PRIVATE_KEY)'
    required: true
  git-signing-passphrase:
    description: 'Passphrase for git-signing-private-key (secrets.CI_BOT_GPG_PASSPHRASE)'
    required: true
  git-signing-key-id:
    description: 'Long key id of git-signing-private-key (secrets.CI_BOT_GPG_KEY_ID)'
    required: true
  bot-name:
    description: 'Git author name for the re-signed commits (identity is preserved; only the signature is redone)'
    default: 'Vidocq CI Bot'
  bot-email:
    description: 'Git author email, only used as a config fallback — original commit authors are untouched'
    default: 'ci@vidocq.io'
  merge:
    description: >-
      Whether to fast-forward merge the PR after rebasing+re-signing.
      Set to 'false' for rebase-only mode (e.g. a /rebase comment): the
      branch is brought up to date and every commit re-signed, but the PR
      is left open for a human (or a later /merge) to merge it.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Rebase, re-sign and (optionally) fast-forward merge
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repo }}
        BASE_URL: ${{ inputs.base-url }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        GIT_SIGNING_PRIVATE_KEY: ${{ inputs.git-signing-private-key }}
        GIT_SIGNING_PASSPHRASE: ${{ inputs.git-signing-passphrase }}
        GIT_SIGNING_KEY_ID: ${{ inputs.git-signing-key-id }}
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        MERGE_AFTER_REBASE: ${{ inputs.merge }}
        # What actually triggered this run. The calling workflow gates on it
        # too, but that workflow is copied into every consumer repository and
        # drifts; this action is resolved from @main, so the guard in merge.sh
        # reaches every repository the moment it is merged here.
        TRIGGER_EVENT: ${{ github.event_name }}
        TRIGGER_COMMENTER: ${{ github.event.comment.user.login }}
        TRIGGER_COMMENT: ${{ github.event.comment.body }}
      run: bash "${{ github.action_path }}/merge.sh"
