name: 'Build impacted downstream consumers'
description: >
  Resolve the transitive downstream consumers of the current repo from the Vidocq
  dependency graph, then rebuild each one — in topological order — against the PR
  artifacts already installed in the local Maven repository. No staging registry:
  the producer (and every rebuilt consumer) is resolved straight from ~/.m2.
  Java + Maven must already be on the PATH (run ci/setup-maven first), and the
  producer must already have been installed locally with `producer-version`.

inputs:
  producer-slug:
    description: 'Forge slug of the repo under PR, e.g. Vidocq/vauban (pass ${{ github.repository }})'
    required: true
  producer-version:
    description: 'Release-style PR version of the producer, already installed in ~/.m2 (no -SNAPSHOT)'
    required: true
  version-suffix:
    description: 'Suffix appended to each consumer base version, e.g. PR42.abc1234 (no -SNAPSHOT)'
    required: true
  bot-token:
    description: >
      Optional Codefloe token (org secret VIDOCQ_BOT_TOKEN). Used only to lift API/clone
      rate limits on internal PRs. External fork PRs do NOT receive org secrets, so this is
      empty there — the graph and every consumer repo are public, so reads and clones fall
      back to anonymous and the whole step runs with zero secrets.
    required: false
    default: ''
  graph-repo:
    description: 'owner/name of the PUBLIC dependency-graph repo (read anonymously — no token needed)'
    default: 'Vidocq/dep-graph'
  graph-ref:
    description: 'Branch of the dependency-graph repo to read the graph + resolver from'
    default: 'main'
  require-fresh-graph:
    description: >
      Fail when the graph (graph/inverted.json, its generated_at) is older than the producer's
      data file (data/<owner>_<repo>.json, its updated_at): a stale graph may not know every
      consumer, and the rebuild would then check too few repositories without saying so.
      'false' only prints a warning. 'true' by default since the dependency-graph repository
      rebuilds the graph in the same commit as every data update (Vidocq/dep-graph#3).
    default: 'true'
  maven-args:
    description: >
      Common Maven args for every consumer build. The default reruns a failing test once
      (surefire and failsafe): a test that then passes does not fail the pull request, and is
      reported as flaky in a warning and in the job summary. Only the consumer builds get it,
      never the producer's own build. A value given here replaces the whole default.
    default: '-B -ntp -Dsurefire.rerunFailingTestsCount=1 -Dfailsafe.rerunFailingTestsCount=1'
  companion-branches:
    description: >
      Rebuild each consumer on the branch named like the PR's head branch when the consumer
      has one (a change spanning several repos), else on its default branch. Applies only to
      a PR from a branch of the producer repo itself, never to a fork PR. 'false' turns it off.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve impacted consumers (topological order, forge-filtered)
      shell: bash
      env:
        PRODUCER_SLUG: ${{ inputs.producer-slug }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        GRAPH_REPO: ${{ inputs.graph-repo }}
        GRAPH_REF: ${{ inputs.graph-ref }}
        REQUIRE_FRESH_GRAPH: ${{ inputs.require-fresh-graph }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 \
           || ! command -v curl >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends python3 jq curl git ca-certificates
        fi

        # Forge slug -> data file name: Vidocq/vauban -> Vidocq_vauban.json
        DATA_FILE="${PRODUCER_SLUG/\//_}.json"
        FORGE="${GITHUB_SERVER_URL%/}"
        RAW="${FORGE}/${GRAPH_REPO}/raw/branch/${GRAPH_REF}"
        echo "Producer=$PRODUCER_SLUG / data file=$DATA_FILE / graph repo=$GRAPH_REPO ref=$GRAPH_REF"

        # The dependency graph is public, so the token is optional. On an external fork PR
        # BOT_TOKEN is empty (org secrets are withheld from forks): drop the auth header and
        # read anonymously. Internal PRs still pass the token to lift rate limits.
        if [ -n "${BOT_TOKEN:-}" ]; then auth=(-H "Authorization: token ${BOT_TOKEN}"); else auth=(); fi
        # Retry on transient forge failures (504 gateway timeout, dropped connections).
        # --retry-all-errors retries on HTTP 5xx too, not just connection errors.
        retry_curl=(--retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused --connect-timeout 15)
        curl -fsSL "${retry_curl[@]}" ${auth[@]+"${auth[@]}"} -o /tmp/inverted.json     "$RAW/graph/inverted.json"
        curl -fsSL "${retry_curl[@]}" ${auth[@]+"${auth[@]}"} -o /tmp/resolve_impact.py "$RAW/scripts/resolve_impact.py"
        curl -fsSL "${retry_curl[@]}" ${auth[@]+"${auth[@]}"} -o /tmp/data.json         "$RAW/data/${DATA_FILE}"

        # A graph older than the producer data may miss consumers: an error when
        # require-fresh-graph is true, a warning otherwise.
        python3 "${ACTION_PATH}/graph-freshness.py" /tmp/inverted.json /tmp/data.json "$REQUIRE_FRESH_GRAPH"

        # Artifacts this repo produces (source of truth kept by update-dep-graph).
        ARTIFACTS=$(python3 - <<'PY'
        import json
        d = json.load(open("/tmp/data.json"))
        print(" ".join(sorted({f"{p['groupId']}:{p['artifactId']}" for p in d.get("produces", [])})))
        PY
        )
        if [ -z "$ARTIFACTS" ]; then
          echo "No io.vidocq.* artifact in data/${DATA_FILE} — graph out of sync?" >&2
          exit 1
        fi
        echo "Produces: $ARTIFACTS"

        # --ordered = producer-before-consumer topological order (required for the
        # sequential rebuild: each level installs locally before the next consumes it).
        MATRIX=$(python3 /tmp/resolve_impact.py \
          --graph /tmp/inverted.json --changed $ARTIFACTS --format matrix --ordered)
        echo "Ordered matrix (raw): $MATRIX"

        # Keep only consumers that already exist on the forge (Codefloe). The migrated graph still
        # lists historical/not-yet-migrated consumers; each rejoins automatically once
        # created — no manual flag. Order is preserved (jq keeps array order).
        : > /tmp/impacted.txt
        for r in $(echo "$MATRIX" | jq -r '.include[].repo'); do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused --connect-timeout 15 \
            ${auth[@]+"${auth[@]}"} "${GITHUB_SERVER_URL%/}/api/v1/repos/$r")
          if [ "$code" = "200" ]; then
            echo "  keep $r"
            echo "$r" >> /tmp/impacted.txt
          else
            echo "  drop $r (not on the forge yet, HTTP $code)"
          fi
        done
        echo "Impacted consumers to rebuild: $(wc -l < /tmp/impacted.txt)"

    - name: Rebuild impacted consumers against local PR artifacts
      shell: bash
      env:
        PRODUCER_SLUG: ${{ inputs.producer-slug }}
        PRODUCER_VERSION: ${{ inputs.producer-version }}
        VERSION_SUFFIX: ${{ inputs.version-suffix }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        MVN_ARGS: ${{ inputs.maven-args }}
        COMPANION_BRANCHES: ${{ inputs.companion-branches }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        if [ ! -s /tmp/impacted.txt ]; then
          echo "No impacted consumer on the forge — nothing to rebuild."
          exit 0
        fi

        # A change spanning several repos: each consumer is rebuilt on its branch named like
        # the PR's head branch, if it has one (see companion-branch.sh).
        companion=$(bash "${ACTION_PATH}/companion-branch.sh" select)
        if [ -n "$companion" ]; then
          echo "Companion branch: consumers that have '$companion' are rebuilt on it."
        fi
        on_companion=()

        # short-name (lowercase last slug segment) -> PR version already in local ~/.m2.
        # Seeded with the producer; each rebuilt consumer is added so the next level
        # resolves it from local M2 instead of central-snapshots.
        declare -A PRV
        producer_short="${PRODUCER_SLUG##*/}"; producer_short="${producer_short,,}"
        PRV["$producer_short"]="$PRODUCER_VERSION"

        WORK="${RUNNER_TEMP:-/tmp}/downstream"
        mkdir -p "$WORK"
        # Build logs of the consumers, read by the flaky-test report step.
        LOGS="${RUNNER_TEMP:-/tmp}/downstream-logs"
        rm -rf "$LOGS"; mkdir -p "$LOGS"

        clone_with_retry() {
          # git has no built-in retry; the forge occasionally returns 504 on clone under load.
          # Retry with exponential backoff, cleaning the dest between attempts. The token in the
          # URL is stripped from log output (${url##*@}). An empty branch clones the default one.
          local url="$1" dest="$2" branch="${3:-}" attempt=1 max=5 delay=5
          local branch_args=()
          [ -n "$branch" ] && branch_args=(--branch "$branch")
          while :; do
            rm -rf "$dest"
            if git clone --quiet --depth 1 ${branch_args[@]+"${branch_args[@]}"} "$url" "$dest"; then return 0; fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::git clone failed after ${max} attempts: ${url##*@}" >&2
              return 1
            fi
            echo "  clone attempt ${attempt}/${max} failed (${url##*@}); retrying in ${delay}s..." >&2
            sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2))
          done
        }

        read_base_version() {
          # Echo the root pom version with any -SNAPSHOT suffix stripped.
          python3 - "$1" <<'PY'
        import re, sys, xml.etree.ElementTree as ET
        root = ET.parse(sys.argv[1]).getroot()
        ns = root.tag[1:].split("}", 1)[0] if root.tag.startswith("{") else ""
        v = root.find(f"{{{ns}}}version") if ns else root.find("version")
        if v is None or not v.text:
            sys.stderr.write("root <version> not found\n"); sys.exit(1)
        print(re.sub(r"-SNAPSHOT$", "", v.text.strip()))
        PY
        }

        sync_plugin_descriptors() {
          # versions:set does not touch resources; maven-plugin modules embed a
          # plugin.xml with a hardcoded <version> that must follow the new version.
          python3 - "$1" <<'PY'
        import re, sys, xml.etree.ElementTree as ET
        from pathlib import Path
        repo = Path(sys.argv[1])
        rp = ET.parse(repo / "pom.xml").getroot()
        ns = rp.tag[1:].split("}", 1)[0] if rp.tag.startswith("{") else ""
        v = rp.find(f"{{{ns}}}version") if ns else rp.find("version")
        version = v.text.strip()
        n = 0
        for pom in repo.rglob("pom.xml"):
            if "target" in pom.parts:
                continue
            try:
                r = ET.parse(pom).getroot()
            except ET.ParseError:
                continue
            pns = r.tag[1:].split("}", 1)[0] if r.tag.startswith("{") else ""
            pkg = r.find(f"{{{pns}}}packaging") if pns else r.find("packaging")
            if pkg is None or (pkg.text or "").strip() != "maven-plugin":
                continue
            px = pom.parent / "src/main/resources/META-INF/maven/plugin.xml"
            if not px.is_file():
                continue
            content = px.read_text(encoding="utf-8")
            new = re.sub(r"(<artifactId>[^<]+</artifactId>\s*\n\s*<version>)[^<]+(</version>)",
                         rf"\g<1>{version}\g<2>", content, count=1)
            if new != content:
                px.write_text(new, encoding="utf-8"); n += 1
        print(f"  plugin.xml synced: {n}")
        PY
        }

        while IFS= read -r slug; do
          [ -z "$slug" ] && continue
          short="${slug##*/}"; short="${short,,}"
          dir="$WORK/$short"
          echo "::group::Rebuild $slug (depends on: ${!PRV[*]})"

          # Anonymous clone on fork PRs (no token); token-auth on internal PRs (rate limits).
          if [ -n "${BOT_TOKEN:-}" ]; then
            clone_url="$(printf %s "${GITHUB_SERVER_URL%/}" | sed "s|https://|https://oauth2:${BOT_TOKEN}@|")/${slug}.git"
          else
            clone_url="${GITHUB_SERVER_URL%/}/${slug}.git"
          fi
          branch=$(bash "${ACTION_PATH}/companion-branch.sh" lookup "$clone_url" "$companion")
          if [ -n "$branch" ]; then
            echo "  branch: $branch (companion branch of the PR)"
            on_companion+=("$slug")
          else
            echo "  branch: default"
          fi
          clone_with_retry "$clone_url" "$dir" "$branch"
          pushd "$dir" >/dev/null

          # 1) Pin every upstream rebuilt in this run to its local PR version.
          #    -D<prop>=<val> on the CLI does not reliably override <version>${prop}</version>
          #    resolution, so we physically rewrite the property in every reactor pom.
          #    One pass, without starting Maven (pin-upstreams.py makes the same edits as one
          #    versions:set-property per upstream). When it cannot tell exactly which poms Maven
          #    would rewrite, it changes nothing and exits non-zero: Maven then does it.
          pins=()
          for up in "${!PRV[@]}"; do pins+=(--pin "${up}=${PRV[$up]}"); done
          if ! python3 "${ACTION_PATH}/pin-upstreams.py" --maven-args="$MVN_ARGS" "${pins[@]}" .; then
            echo "::warning::${slug}: upstream versions not pinned in one pass, falling back to one versions:set-property per upstream"
            for up in "${!PRV[@]}"; do
              if grep -rqlF "<${up}.version>" --include=pom.xml .; then
                echo "  set ${up}.version=${PRV[$up]}"
                mvn $MVN_ARGS versions:set-property \
                  -Dproperty="${up}.version" -DnewVersion="${PRV[$up]}" \
                  -DprocessAllModules=true -DgenerateBackupPoms=false </dev/null
              fi
            done
          fi

          # 2) Give this consumer its own release-style PR version so the next level
          #    resolves it from local M2 (release = immutable, never re-fetched).
          base=$(read_base_version pom.xml)
          cver="${base}-${VERSION_SUFFIX}"
          echo "  consumer version: $cver"
          mvn $MVN_ARGS versions:set \
            -DnewVersion="$cver" -DprocessAllModules=true -DgenerateBackupPoms=false </dev/null
          sync_plugin_descriptors .

          # 3) install (runs unit + integration tests) -> available for downstream levels.
          #    The log is kept for the flaky-test report (pipefail keeps Maven's exit status).
          printf '%s\t%s\n' "$slug" "$LOGS/$short.log" >> "$LOGS/consumers.tsv"
          mvn $MVN_ARGS install </dev/null 2>&1 | tee "$LOGS/$short.log"

          PRV["$short"]="$cver"
          popd >/dev/null
          rm -rf "$dir"        # keep the M2, drop the checkout
          echo "::endgroup::"
        done < /tmp/impacted.txt

        echo "All impacted consumers rebuilt OK against the PR artifacts."
        if [ "${#on_companion[@]}" -gt 0 ]; then
          # Merge these right after the producer: until then their main does not build.
          echo "::notice::Rebuilt on the companion branch '$companion': ${on_companion[*]}"
        fi

    # A test that failed, then passed when run again, is listed by surefire/failsafe under
    # "Flakes:". Each one becomes a warning and a row of the job summary, naming the consumer,
    # so that it gets a BUG.md entry instead of going unnoticed. Runs after a failed rebuild
    # too; it only reports and never fails.
    - name: Report flaky tests of the consumer builds
      if: always()
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail
        list="${RUNNER_TEMP:-/tmp}/downstream-logs/consumers.tsv"
        if [ ! -s "$list" ]; then
          echo "No consumer build log to read."
          exit 0
        fi
        args=()
        while IFS=$'\t' read -r slug log; do args+=("${slug}=${log}"); done < "$list"
        python3 "${ACTION_PATH}/flakes.py" "${args[@]}" || true
