name: 'GPG check'
description: 'Verify every PR commit is GPG-signed by a registered Vidocq contributor key'

# One of the 3 independently-reportable status checks split out of the
# original governance-checks bundle. See cla-check/action.yml for the
# rationale (composite action, not workflow_call — Forgejo/Codeberg does not
# resolve cross-repo reusable workflows).
#
# The calling job MUST check out its repository with fetch-depth: 0 so this
# can read the full BASE_REF..HEAD commit range.
#
# Signature-based, unlike cla-check/dco-check: any later rebase or re-sign of
# the PR branch (e.g. by merge-bot) changes the commit hashes, so this check
# re-runs and re-verifies against the new signatures — this is the one
# status context that is expected to be re-evaluated after a merge-bot pass.

runs:
  using: composite
  steps:
    - name: Fetch the governance repository (GPG keys)
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/governance"
        git clone --depth 1 "${GITHUB_SERVER_URL%/}/Vidocq/governance" "$RUNNER_TEMP/governance"

    - name: Check GPG signatures on all PR commits
      shell: bash
      run: |
        set -euo pipefail
        for keyfile in "$RUNNER_TEMP"/governance/.forgejo/keys/*.asc; do
          [ -f "$keyfile" ] || continue
          gpg --import "$keyfile" 2>/dev/null && echo "Imported: $(basename "$keyfile")" || true
        done

        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE_REF="origin/$GITHUB_BASE_REF"
        elif git show-ref --verify --quiet refs/remotes/origin/HEAD; then
          BASE_REF="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
        else
          BASE_REF="origin/main"
        fi

        # A commit produced by the forge's own web "Update branch" button (merge mode):
        # exactly two parents, author identical to committer, an author address under
        # @noreply.codefloe.com and a "Merge branch '…' into …" subject. Such a commit
        # still fails — a forge signs nothing, and exempting it would let any unsigned
        # merge through — but the remedy to print is not the contributor's GPG setup.
        # Every field is read with its own `git log -1`, so a subject containing spaces
        # or quotes cannot shift the parsing.
        is_forge_update_commit() {
          local hash="$1" parents author_name author_email committer_name committer_email subject
          parents="$(git log -1 --format='%P' "$hash")"
          set -- $parents
          [ "$#" -eq 2 ] || return 1
          author_name="$(git log -1 --format='%an' "$hash")"
          author_email="$(git log -1 --format='%ae' "$hash")"
          committer_name="$(git log -1 --format='%cn' "$hash")"
          committer_email="$(git log -1 --format='%ce' "$hash")"
          [ "$author_name" = "$committer_name" ] || return 1
          [ "$author_email" = "$committer_email" ] || return 1
          case "$author_email" in *@noreply.codefloe.com) ;; *) return 1 ;; esac
          subject="$(git log -1 --format='%s' "$hash")"
          case "$subject" in "Merge branch '"*"' into "*) ;; *) return 1 ;; esac
          return 0
        }

        UNSIGNED_FORGE=""
        UNSIGNED_OTHER=""
        while IFS= read -r hash; do
          [ -n "$hash" ] || continue
          git verify-commit "$hash" 2>/dev/null && continue
          email="$(git log -1 --format='%ae' "$hash")"
          if is_forge_update_commit "$hash"; then
            UNSIGNED_FORGE="${UNSIGNED_FORGE}  $hash ($email) $(git log -1 --format='%s' "$hash")"$'\n'
          else
            UNSIGNED_OTHER="${UNSIGNED_OTHER}  $hash ($email)"$'\n'
          fi
        done < <(git log "$BASE_REF"..HEAD --format='%H')

        FAILED=0
        if [ -n "$UNSIGNED_OTHER" ]; then
          echo "❌ The following commits are not GPG-signed or have invalid signatures:"
          printf '%s' "$UNSIGNED_OTHER"
          echo ""
          echo "All commits must be GPG-signed."
          echo "See https://codefloe.com/Vidocq/governance/src/branch/main/CONTRIBUTING.md#set-up-gpg-commit-signing"
          echo ""
          FAILED=1
        fi
        if [ -n "$UNSIGNED_FORGE" ]; then
          echo "❌ The following commits are not GPG-signed and were created by the forge itself:"
          printf '%s' "$UNSIGNED_FORGE"
          echo ""
          echo "This commit was created by the web \"Update branch\" button, not by you."
          echo "A forge signs nothing when it merges on the server, and its rebase mode"
          echo "would strip the signatures from your other commits instead."
          echo "Comment '/rebase' on this pull request: the merge-bot will rebase the branch,"
          echo "re-sign every commit with the CI key and force-push, leaving the pull request"
          echo "open."
          echo ""
          FAILED=1
        fi
        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi
        echo "✅ All commits are correctly GPG-signed"
