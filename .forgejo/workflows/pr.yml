# Pull-request governance gate for repositories without a build pipeline
# (docs, infra, templates). Verifies that the PR author signed the Vidocq
# CLA, every PR commit is GPG-signed, and every PR commit carries a
# Signed-off-by trailer, via 3 independent shared composite actions
# (Vidocq/ci/cla-check, gpg-check, dco-check — split out of the previous
# bundled governance-checks so a merge-bot re-sign only needs to re-run
# gpg-check).
#
# NOTE: `pull_request` workflows run from the PR branch's version of this
# file, so a PR based on an older commit (or one that removes a job) will
# simply not report that context. Branch protection on `main` therefore
# REQUIRES all 3 "pr-validate / <job> (pull_request)" contexts: such a PR
# stays unmergeable until it is rebased on a base that has the gate.
name: pr-validate
on:
  pull_request:
    branches: [main]

jobs:
  cla-check:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/cla-check@bdcd808a9076918dcff7817000b5dcdf90288d17
        with:
          pr-author: ${{ github.event.pull_request.user.login }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  gpg-check:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/gpg-check@bdcd808a9076918dcff7817000b5dcdf90288d17

  dco-check:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/dco-check@bdcd808a9076918dcff7817000b5dcdf90288d17

  # The actions' own script tests (local git repositories and stubs, no network).
  action-tests:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          if ! command -v git >/dev/null || ! command -v jq >/dev/null || ! command -v python3 >/dev/null \
              || ! command -v curl >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git jq python3 curl ca-certificates
          fi
          bash build-impacted/companion-branch-test.sh
          bash build-impacted/graph-freshness-test.sh
          bash build-impacted/pin-upstreams-test.sh
          bash build-impacted/flakes-test.sh
          bash build-impacted/resolve-consumers-test.sh
          bash build-impacted/chain-step-test.sh
          bash resolve-impacted/impacted-matrix-test.sh
          bash build-one-consumer/build-consumer-test.sh
          bash producer-artifacts/producer-artifacts-test.sh
          bash build-one-consumer/baseline/baseline-test.sh
          bash build-one-consumer/targeted/targeted-test.sh
          bash targeted-producer-tests/producer-tests-test.sh
          bash sonar-analysis/targeted-build-test.sh
          bash select-tck/select-tck-test.sh
          bash validated-tree/validated-tree-test.sh
          bash docs-only-changes/changes-test.sh
          bash bench-window/bench-window-test.sh
          bash merge-bot/required-checks-test.sh
          bash merge-bot/checks-timeout-test.sh
          bash merge-bot/refusal-test.sh
          bash merge-bot/schedule-test.sh
          bash pr-validate-gate/gate-test.sh
          bash scripts/train-merge-test.sh
          bash setup-maven/install-maven-test.sh
          bash release-maven/bump-consumers-test.sh
          bash check-brick-versions/check-brick-versions-test.sh
          bash check-brick-versions/fetch-and-check-test.sh
