name: merge-bot (reusable)

# The merge-bot every Vidocq repository runs, in one place.
#
# Consumer repositories keep a merge-bot.yml that declares the triggers and
# calls this workflow; everything that decides what the bot does lives here.
# The alternative was a full copy of this file in each of the twenty-odd
# repositories, which is how the self-trigger defect (#21) came to need twenty
# separate pull requests to fix rather than one.
#
# The guards are duplicated on purpose. This workflow refuses a trigger the bot
# wrote itself and a trigger that is not the first thing in a comment; merge.sh
# refuses the same two again. A repository whose caller has drifted, or which
# has not been converted yet, is still protected by the script, because every
# repository resolves the action from @main.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number — only for a workflow_dispatch caller'
        required: false
        type: string
      merge:
        description: "Fast-forward merge after rebasing? 'false' for rebase-only."
        required: false
        default: 'true'
        type: string
    secrets:
      VIDOCQ_BOT_TOKEN:
        required: true
      CI_BOT_GPG_PRIVATE_KEY:
        required: true
      CI_BOT_GPG_PASSPHRASE:
        required: true
      CI_BOT_GPG_KEY_ID:
        required: true

# One merge-bot run at a time per repository. Two runs force-pushing to the
# same repository in the same second left one of them wedged inside
# `git push --force-with-lease`, holding a runner and never reporting.
# Queue them instead of cancelling: each one was asked for by a human.
concurrency:
  group: merge-bot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    # A trigger is the FIRST thing in a comment, and never something the bot
    # itself said. Both halves matter: `contains` matched the token anywhere in
    # any comment, so the rebase-only success message below -- which names
    # /merge to tell a human what to do next -- re-triggered this workflow in
    # merge mode and merged six pull requests that had only been asked to
    # rebase. `startsWith` also stops a human from merging a PR by writing
    # "I'll /merge once CI is green".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.login != 'vidocq-ci-bot' &&
       (startsWith(github.event.comment.body, '/merge') || startsWith(github.event.comment.body, '/rebase')))
    runs-on: vidocq-runner
    timeout-minutes: 45
    steps:
      - name: Resolve PR number, actor and mode
        id: ctx
        run: |
          set -euo pipefail
          echo "pr-number=${{ inputs.pr-number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          echo "actor=${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "merge=${{ inputs.merge }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ startsWith(github.event.comment.body, '/rebase') }}" == "true" ]]; then
            # Matched the same way as the gate above: a comment opening with
            # /merge and mentioning /rebase later asked to merge.
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require write access
        if: github.event_name == 'issue_comment'
        env:
          BOT_TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          ACTOR: ${{ steps.ctx.outputs.actor }}
        run: |
          set -euo pipefail
          # The /collaborators/{user}/permission endpoint requires an admin-level
          # token, which the bot deliberately does not have. Instead, check
          # membership in the org teams that actually hold push/merge rights on
          # protected branches (see branch_protections.push_whitelist_teams):
          # devs (1500) and Owners (752). Team IDs are org-scoped, stable across
          # every Vidocq repo.
          authorized=false
          for team_id in 1500 752; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $BOT_TOKEN" \
              "https://codefloe.com/api/v1/teams/${team_id}/members/${ACTOR}")
            if [[ "$code" == "200" ]]; then authorized=true; break; fi
          done
          $authorized \
            || { echo "::error::@${ACTOR} is not a member of devs/Owners — refusing"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      # Named in full rather than `./merge-bot`: the checkout above is the
      # calling repository, not this one.
      - uses: https://codefloe.com/Vidocq/ci/merge-bot@main
        with:
          pr-number: ${{ steps.ctx.outputs.pr-number }}
          repo: ${{ github.repository }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          git-signing-private-key: ${{ secrets.CI_BOT_GPG_PRIVATE_KEY }}
          git-signing-passphrase: ${{ secrets.CI_BOT_GPG_PASSPHRASE }}
          git-signing-key-id: ${{ secrets.CI_BOT_GPG_KEY_ID }}
          merge: ${{ steps.ctx.outputs.merge }}

      - name: Comment on success (rebase-only)
        if: success() && github.event_name == 'issue_comment' && steps.ctx.outputs.merge == 'false'
        env:
          BOT_TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: token $BOT_TOKEN" -H "Content-Type: application/json" \
            -d '{"body":"✅ rebased onto the base branch and re-signed every commit. Still open — use /merge when ready."}' \
            "https://codefloe.com/api/v1/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

      - name: Comment on failure
        if: failure() && github.event_name == 'issue_comment'
        env:
          BOT_TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: token $BOT_TOKEN" -H "Content-Type: application/json" \
            -d '{"body":"❌ merge-bot failed — see the Actions run log for details."}' \
            "https://codefloe.com/api/v1/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
