name: 'Setup Java + Maven'
description: 'Installe Temurin + Maven (versions surchargeables) et les met dans le PATH'

inputs:
  java-version:
    description: 'Version du JDK Temurin'
    default: '25'
  distribution:
    description: 'Distribution JDK passée à setup-java'
    default: 'temurin'
  maven-version:
    description: 'Version de Maven à installer (ex. 4.0.0-rc-5 ou 3.9.9 ; le préfixe majeur choisit maven-3/ vs maven-4/)'
    default: '4.0.0-rc-5'
  cache:
    description: 'Cache de dépendances de setup-java (maven, gradle, sbt... ou vide pour désactiver)'
    default: 'maven'

runs:
  using: composite
  steps:
    - name: Set up Java ${{ inputs.java-version }} (${{ inputs.distribution }})
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache }}

    - name: Install Maven ${{ inputs.maven-version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        major="${MAVEN_VERSION%%.*}"
        url="https://dlcdn.apache.org/maven/maven-${major}/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        echo "Téléchargement de Maven ${MAVEN_VERSION} depuis ${url}"
        wget -q "$url"
        tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C /opt
        echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
