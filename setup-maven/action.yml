name: 'Setup Java + Maven'
description: 'Install Temurin + Maven (both versions overridable) and put them on the PATH'

inputs:
  java-version:
    description: 'Temurin JDK version'
    default: '25'
  distribution:
    description: 'JDK distribution passed to setup-java'
    default: 'temurin'
  maven-version:
    description: 'Maven version to install (e.g. 3.9.16 or 4.0.0-rc-5; the major prefix selects maven-3/ vs maven-4/)'
    default: '3.9.16'
  cache:
    description: >
      Dependency cache. 'maven' (default): ~/.m2/repository through actions/cache, with an
      explicit key (see below). Any other value (gradle, sbt...) is passed to setup-java's own
      cache. Empty: no cache.
    default: 'maven'

runs:
  using: composite
  steps:
    - name: Set up Java ${{ inputs.java-version }} (${{ inputs.distribution }})
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        # The Maven cache is the actions/cache step below, never setup-java's: setup-java
        # compares the key it restored with the key it saves case-sensitively, and the two
        # differ in case (linux vs Linux), so it saved the whole repository again after every
        # job (Vidocq/vidocq#285).
        cache: ${{ inputs.cache != 'maven' && inputs.cache || '' }}

    # One cache per repository and set of poms. An exact hit is not saved again; a miss
    # restores the newest cache of the same repository, else of any repository, and saves a
    # new one at the end of the job. Artifacts installed at a pull-request version
    # (io/vidocq/**/<version>-PR<n>.<sha>) or at a nightly version
    # (io/vidocq/**/<version>-NIGHTLY.<sha>, downstream-nightly.yml) are left out of the saved
    # cache: they are release-style, so they are never resolved again and would only make the
    # cache bigger.
    # actions/cache cannot leave them out through `path` (a `!` pattern is ignored under a
    # directory it archives whole), so GNU tar's TAR_OPTIONS does it, on this step only (its
    # save runs at the end of the job, with the same environment).
    - name: Cache the Maven repository
      if: inputs.cache == 'maven'
      uses: actions/cache@v4
      env:
        TAR_OPTIONS: '--exclude=io/vidocq/*-PR[0-9]* --exclude=io/vidocq/*-NIGHTLY*'
      with:
        path: ~/.m2/repository
        # The job is part of the key: otherwise the first job to save a set of poms (usually sonar) wins, and the
        # dependencies another job adds (the downstream consumers of pr-validate) are never cached.
        key: m2-${{ runner.os }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          m2-${{ runner.os }}-${{ github.repository }}-${{ github.job }}-
          m2-${{ runner.os }}-${{ github.repository }}-
          m2-${{ runner.os }}-

    # Temporary (Vidocq/vidocq#292): Maven refuses the eMudhra intermediate CAs whose private
    # keys leaked on 2026-10-20, until Temurin ships a JDK that does. The JDK checks no
    # revocation, so without this Maven would accept a forged certificate for Maven Central.
    # Maven gets its own trust store; the JDK stays untouched, because jlink refuses a
    # modified JDK that has no jmods.
    - name: Trust store without the compromised eMudhra CAs, for Maven
      shell: bash
      run: |
        set -euo pipefail
        ts="${RUNNER_TEMP:-/tmp}/vidocq-maven-cacerts"
        bash "${{ github.action_path }}/block-emudhra-intermediates.sh" "$JAVA_HOME" "$ts"
        echo "MAVEN_OPTS=${MAVEN_OPTS:+$MAVEN_OPTS }-Djavax.net.ssl.trustStore=$ts -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"

    - name: Install Maven ${{ inputs.maven-version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        major="${MAVEN_VERSION%%.*}"
        url="https://dlcdn.apache.org/maven/maven-${major}/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        echo "Downloading Maven ${MAVEN_VERSION} from ${url}"
        wget -q "$url"
        tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C /opt
        echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Configure settings.xml (resolve SNAPSHOT deps from maven.vidocq.dev and central-snapshots)
      shell: bash
      # Needed so Maven can resolve the vidocq-parent SNAPSHOT parent and any upstream
      # io.vidocq.* SNAPSHOTs: maven.vidocq.dev first, where main publishes them, then central-snapshots
      # for the other projects' SNAPSHOTs. Both are publicly readable (no credentials).
      # deploy-maven later overwrites this file with the same repos + the deploy servers.
      run: |
        set -euo pipefail
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings>
          <profiles>
            <profile>
              <id>vidocq-snapshots</id>
              <repositories>
                <repository>
                  <id>vidocq-snapshots</id>
                  <url>https://maven.vidocq.dev/snapshots</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                </repository>
                <repository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <!-- always: PR runners restore a cached ~/.m2, and Maven's default
                       daily policy would keep a stale upstream SNAPSHOT for 24h
                       (seen on cassini PR #15 racing a freshly merged chappe). -->
                  <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>vidocq-snapshots</id>
                  <url>https://maven.vidocq.dev/snapshots</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>vidocq-snapshots</activeProfile>
          </activeProfiles>
        </settings>
        EOF
