name: 'Setup Java + Maven'
description: 'Install Temurin + Maven (both versions overridable) and put them on the PATH'

inputs:
  java-version:
    description: 'Temurin JDK version'
    default: '25'
  distribution:
    description: 'JDK distribution passed to setup-java'
    default: 'temurin'
  maven-version:
    description: 'Maven version to install (e.g. 3.9.16 or 4.0.0-rc-5; the major prefix selects maven-3/ vs maven-4/)'
    default: '3.9.16'
  cache:
    description: 'setup-java dependency cache (maven, gradle, sbt... or empty to disable)'
    default: 'maven'

runs:
  using: composite
  steps:
    - name: Set up Java ${{ inputs.java-version }} (${{ inputs.distribution }})
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache }}

    - name: Install Maven ${{ inputs.maven-version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        major="${MAVEN_VERSION%%.*}"
        url="https://dlcdn.apache.org/maven/maven-${major}/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        echo "Downloading Maven ${MAVEN_VERSION} from ${url}"
        wget -q "$url"
        tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C /opt
        echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Configure settings.xml (resolve SNAPSHOT deps from central-snapshots)
      shell: bash
      # Needed so Maven can resolve the vidocq-parent SNAPSHOT parent and any upstream
      # io.vidocq.* SNAPSHOTs. central-snapshots is publicly readable (no credentials).
      # deploy-maven later overwrites this file with the same repos + the deploy servers.
      run: |
        set -euo pipefail
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings>
          <profiles>
            <profile>
              <id>vidocq-snapshots</id>
              <repositories>
                <repository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central-snapshots</id>
                  <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                  <releases><enabled>false</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>vidocq-snapshots</activeProfile>
          </activeProfiles>
        </settings>
        EOF
